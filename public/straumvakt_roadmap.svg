<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1880" viewBox="0 0 1800 1880">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.55" stop-color="#070a12"/>
      <stop offset="1" stop-color="#03050a"/>
    </linearGradient>
    <linearGradient id="bandDone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c2a1f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0a1f18" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="bandPilot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#28210b" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#1d180a" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="bandPost" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a172a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#16142a" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="newRow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a2810" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#2a1d0c" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .title { font: 800 44px Inter, Segoe UI, Arial, sans-serif; fill: #f5f7fa; }
      .subtitle { font: 400 18px Inter, Segoe UI, Arial, sans-serif; fill: #9aa7b8; }
      .phase { font: 800 26px Inter, Segoe UI, Arial, sans-serif; fill: #f5f7fa; letter-spacing: 1.4px; }
      .phaseSub { font: 500 15px Inter, Segoe UI, Arial, sans-serif; fill: #9aa7b8; }
      .sprintLabel { font: 800 18px Inter, Segoe UI, Arial, sans-serif; fill: #f5f7fa; }
      .sprintArea { font: 800 17px Inter, Segoe UI, Arial, sans-serif; fill: #f5f7fa; }
      .sprintAreaNew { font: 800 17px Inter, Segoe UI, Arial, sans-serif; fill: #ffd97a; }
      .statusBadge { font: 800 11px Inter, Segoe UI, Arial, sans-serif; letter-spacing: 1.2px; }
      .scopeLabel { font: 700 11px Inter, Segoe UI, Arial, sans-serif; fill: #6b7791; letter-spacing: 1.2px; }
      .body { font: 500 14px Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; }
      .bodyMuted { font: 500 14px Inter, Segoe UI, Arial, sans-serif; fill: #8a96aa; }
      .topicLabel { font: 800 13px Inter, Segoe UI, Arial, sans-serif; fill: #b894ff; letter-spacing: 1.4px; }
      .topicItem { font: 500 14px Inter, Segoe UI, Arial, sans-serif; fill: #d4cce8; }
      .topicItemNew { font: 500 14px Inter, Segoe UI, Arial, sans-serif; fill: #ffb3a3; }
      .footer { font: 400 14px Inter, Segoe UI, Arial, sans-serif; fill: #6b7791; }
      .deferredCount { font: 700 11px Inter, Segoe UI, Arial, sans-serif; fill: #b894ff; letter-spacing: 0.8px; }
      .pendingCount { font: 700 11px Inter, Segoe UI, Arial, sans-serif; fill: #f7b733; letter-spacing: 0.8px; }
      .newBadge { font: 800 10px Inter, Segoe UI, Arial, sans-serif; fill: #ffd97a; letter-spacing: 1.4px; }
      .removedBadge { font: 800 10px Inter, Segoe UI, Arial, sans-serif; fill: #ff8a7a; letter-spacing: 1.4px; }
    </style>
  </defs>

  <rect width="1800" height="1880" fill="url(#bg)"/>
  <circle cx="1480" cy="160" r="280" fill="#2bb6e8" opacity="0.06"/>
  <circle cx="220" cy="1700" r="320" fill="#b894ff" opacity="0.05"/>
  <circle cx="240" cy="850" r="260" fill="#3ee9a7" opacity="0.04"/>

  <!-- HEADER -->
  <text x="90" y="86" class="title">Straumvakt Roadmap</text>
  <text x="90" y="120" class="subtitle">Pilot scope tightened further (2026-04-25 v2). Pilot is admin-functionality only — no driver-facing features, no Issue Engine.</text>
  <text x="90" y="142" class="subtitle">Status: Sprint 1.5 complete. New Sprint 2 (Admin Onboarding + Zaptec) and Sprint 4 (Data Lifecycle) inserted. Driver Experience and Issue Engine entire sprints moved to post-pilot.</text>

  <!-- ============================================================ -->
  <!-- PHASE 1 — DONE                                               -->
  <!-- ============================================================ -->
  <g filter="url(#shadow)">
    <rect x="70" y="180" width="1660" height="320" rx="20" fill="url(#bandDone)" stroke="#3ee9a7" stroke-opacity="0.35" stroke-width="1.2"/>
  </g>
  <rect x="70" y="180" width="6" height="320" rx="3" fill="#3ee9a7"/>

  <text x="100" y="225" class="phase">DONE · FOUNDATION</text>
  <text x="100" y="248" class="phaseSub">Schema, OCPP wiring, login shell. Sprints −1, 0, 1.</text>

  <g>
    <text x="100" y="290" class="sprintLabel">Sprint −1</text>
    <text x="100" y="310" class="sprintArea">Login Shell</text>
    <rect x="240" y="278" width="50" height="18" rx="9" fill="#0e2c20" stroke="#3ee9a7" stroke-opacity="0.7"/>
    <text x="265" y="290" text-anchor="middle" class="statusBadge" fill="#8ef5c7">DONE</text>
    <text x="320" y="295" class="body">Admin login · session handling · base app shell · dev/staging/prod wiring</text>
  </g>

  <g>
    <text x="100" y="350" class="sprintLabel">Sprint 0</text>
    <text x="100" y="370" class="sprintArea">Foundation Schema</text>
    <rect x="240" y="338" width="50" height="18" rx="9" fill="#0e2c20" stroke="#3ee9a7" stroke-opacity="0.7"/>
    <text x="265" y="350" text-anchor="middle" class="statusBadge" fill="#8ef5c7">DONE</text>
    <text x="320" y="355" class="body">V3 schemas · tenancy · event log · idempotency · repositories · hardware catalog seed</text>
  </g>

  <g>
    <text x="100" y="410" class="sprintLabel">Sprint 1</text>
    <text x="100" y="430" class="sprintArea">OCPP Foundation</text>
    <rect x="240" y="398" width="74" height="18" rx="9" fill="#0e2c20" stroke="#3ee9a7" stroke-opacity="0.7"/>
    <text x="277" y="410" text-anchor="middle" class="statusBadge" fill="#8ef5c7">DONE 1.5</text>
    <text x="338" y="415" class="body">Ingest · translator · projections · outbound commands · gateway Worker · Durable Objects</text>
  </g>

  <text x="100" y="470" class="scopeLabel">UNLOCKED · authenticated operator surface · real domain model · chargers can talk to Straumvakt</text>

  <!-- ============================================================ -->
  <!-- PHASE 2 — PILOT                                              -->
  <!-- ============================================================ -->
  <g filter="url(#shadow)">
    <rect x="70" y="540" width="1660" height="720" rx="20" fill="url(#bandPilot)" stroke="#f7b733" stroke-opacity="0.4" stroke-width="1.2"/>
  </g>
  <rect x="70" y="540" width="6" height="720" rx="3" fill="#f7b733"/>

  <text x="100" y="585" class="phase">PILOT · ADMIN-ONLY SCOPE</text>
  <text x="100" y="608" class="phaseSub">Demonstrable platform from the operator's seat. No driver-facing features, no Issue Engine, no money movement, no roaming. Operator runs sites; Straumvakt receives charger events; presentable billing data exists.</text>

  <!-- Sprint 2 — NEW: Admin Onboarding + Zaptec -->
  <g>
    <rect x="90" y="638" width="1620" height="56" rx="10" fill="url(#newRow)" stroke="#ffd97a" stroke-opacity="0.55" stroke-width="1.2"/>
    <rect x="90" y="638" width="4" height="56" rx="2" fill="#ffd97a"/>
    <text x="106" y="664" class="sprintLabel">Sprint 2</text>
    <text x="106" y="684" class="sprintAreaNew">Admin Onboarding + Zaptec API Enrichment</text>
    <rect x="486" y="650" width="50" height="18" rx="9" fill="#2c2510" stroke="#f7b733" stroke-opacity="0.7"/>
    <text x="511" y="662" text-anchor="middle" class="statusBadge" fill="#f7b733">NEXT</text>
    <rect x="543" y="650" width="46" height="18" rx="9" fill="#2c2510" stroke="#ffd97a" stroke-opacity="0.7"/>
    <text x="566" y="662" text-anchor="middle" class="newBadge">NEW</text>
    <text x="601" y="660" class="body">Admin CRUD: Org/CPO · ChargerHost · Property · Site · [Installation] · [Circuit?] · Charger · OCPPIdentity</text>
    <text x="601" y="681" class="body">Charger onboarding wizard · Zaptec OAuth + API enrichment · Beta operator console shell · Billing UI scaffold</text>
  </g>

  <!-- Sprint 3 — OCPI -->
  <g>
    <text x="100" y="725" class="sprintLabel">Sprint 3</text>
    <text x="100" y="745" class="sprintArea">OCPI Foundation (CPO-only)</text>
    <rect x="370" y="713" width="60" height="18" rx="9" fill="#1a2030" stroke="#5a7088" stroke-opacity="0.55"/>
    <text x="400" y="725" text-anchor="middle" class="statusBadge" fill="#9aa7b8">FUTURE</text>
    <text x="446" y="730" class="body">CPO endpoints (locations, sessions, CDRs, tariffs), basic RFID authorize</text>
    <rect x="446" y="742" width="138" height="16" rx="8" fill="#1a172a" stroke="#b894ff" stroke-opacity="0.5"/>
    <text x="515" y="753" text-anchor="middle" class="deferredCount">↪ 2 DEFERRED · A</text>
  </g>

  <!-- Sprint 4 — NEW: Data Storage Lifecycle -->
  <g>
    <rect x="90" y="763" width="1620" height="56" rx="10" fill="url(#newRow)" stroke="#ffd97a" stroke-opacity="0.55" stroke-width="1.2"/>
    <rect x="90" y="763" width="4" height="56" rx="2" fill="#ffd97a"/>
    <text x="106" y="789" class="sprintLabel">Sprint 4</text>
    <text x="106" y="809" class="sprintAreaNew">Data Storage Lifecycle</text>
    <rect x="370" y="775" width="60" height="18" rx="9" fill="#1a2030" stroke="#5a7088" stroke-opacity="0.55"/>
    <text x="400" y="787" text-anchor="middle" class="statusBadge" fill="#9aa7b8">FUTURE</text>
    <rect x="437" y="775" width="46" height="18" rx="9" fill="#2c2510" stroke="#ffd97a" stroke-opacity="0.7"/>
    <text x="460" y="787" text-anchor="middle" class="newBadge">NEW</text>
    <text x="496" y="785" class="body">Charge-log retention machinery: nightly aggregation of raw_protocol → aggregate; aging-out of raw_protocol</text>
    <text x="496" y="806" class="body">at 30–90 d; financial + operational kept hot indefinitely; cold-archive scaffolding for issue_history</text>
  </g>

  <!-- Sprint 5 — Commercial Model -->
  <g>
    <text x="100" y="850" class="sprintLabel">Sprint 5</text>
    <text x="100" y="870" class="sprintArea">Commercial Model (ISK only)</text>
    <rect x="370" y="838" width="60" height="18" rx="9" fill="#1a2030" stroke="#5a7088" stroke-opacity="0.55"/>
    <text x="400" y="850" text-anchor="middle" class="statusBadge" fill="#9aa7b8">FUTURE</text>
    <text x="446" y="855" class="body">CustomerPlan · ChargerServicePlan · tariff engine · plan selection (ISK only)</text>
    <rect x="446" y="867" width="138" height="16" rx="8" fill="#1a172a" stroke="#b894ff" stroke-opacity="0.5"/>
    <text x="515" y="878" text-anchor="middle" class="deferredCount">↪ 1 DEFERRED · C</text>
  </g>

  <!-- Sprint 6 — Billing Dashboard (Issue Engine REMOVED from this slot) -->
  <g>
    <text x="100" y="910" class="sprintLabel">Sprint 6</text>
    <text x="100" y="930" class="sprintArea">Billing Dashboard</text>
    <rect x="370" y="898" width="60" height="18" rx="9" fill="#1a2030" stroke="#5a7088" stroke-opacity="0.55"/>
    <text x="400" y="910" text-anchor="middle" class="statusBadge" fill="#9aa7b8">FUTURE</text>
    <text x="446" y="915" class="body">Billing data + dashboard view (read-only presentation, no money movement)</text>
    <rect x="446" y="927" width="138" height="16" rx="8" fill="#1a172a" stroke="#b894ff" stroke-opacity="0.5"/>
    <text x="515" y="938" text-anchor="middle" class="deferredCount">↪ 5 DEFERRED · E</text>
  </g>

  <!-- Sprint 7 — Push API + Observability -->
  <g>
    <text x="100" y="970" class="sprintLabel">Sprint 7</text>
    <text x="100" y="990" class="sprintArea">Push API + Observability</text>
    <rect x="370" y="958" width="60" height="18" rx="9" fill="#1a2030" stroke="#5a7088" stroke-opacity="0.55"/>
    <text x="400" y="970" text-anchor="middle" class="statusBadge" fill="#9aa7b8">FUTURE</text>
    <text x="446" y="975" class="body">Webhook subscriptions · canonical events · retries · DLQ · OTel · tenant dashboard</text>
  </g>

  <!-- Sprint 8 — Hardening -->
  <g>
    <text x="100" y="1030" class="sprintLabel">Sprint 8</text>
    <text x="100" y="1050" class="sprintArea">Hardening</text>
    <rect x="370" y="1018" width="60" height="18" rx="9" fill="#1a2030" stroke="#5a7088" stroke-opacity="0.55"/>
    <text x="400" y="1030" text-anchor="middle" class="statusBadge" fill="#9aa7b8">FUTURE</text>
    <text x="446" y="1035" class="body">Backup restore drill · OCPP gateway load test</text>
    <rect x="446" y="1047" width="138" height="16" rx="8" fill="#1a172a" stroke="#b894ff" stroke-opacity="0.5"/>
    <text x="515" y="1058" text-anchor="middle" class="deferredCount">↪ 3 DEFERRED · F</text>
  </g>

  <!-- Sprint 9 — Multi-Tenant -->
  <g>
    <text x="100" y="1090" class="sprintLabel">Sprint 9</text>
    <text x="100" y="1110" class="sprintArea">Multi-Tenant + White-Label</text>
    <rect x="370" y="1078" width="60" height="18" rx="9" fill="#1a2030" stroke="#5a7088" stroke-opacity="0.55"/>
    <text x="400" y="1090" text-anchor="middle" class="statusBadge" fill="#9aa7b8">FUTURE</text>
    <text x="446" y="1095" class="body">Re-skin Sprint-2 admin flows for new orgs · Host branding · RLS audit · scoped API keys</text>
    <rect x="446" y="1107" width="138" height="16" rx="8" fill="#1a172a" stroke="#b894ff" stroke-opacity="0.5"/>
    <text x="515" y="1118" text-anchor="middle" class="deferredCount">↪ 1 DEFERRED · A</text>
  </g>

  <!-- Sprint 10 — Pilot Go-Live (highlighted) -->
  <g>
    <rect x="90" y="1150" width="1620" height="92" rx="14" fill="#0d1322" stroke="#f7b733" stroke-opacity="0.45" stroke-width="1.4"/>
    <text x="110" y="1184" class="sprintLabel">Sprint 10</text>
    <text x="110" y="1205" class="sprintArea">Pilot Go-Live (admin-only)</text>
    <rect x="380" y="1174" width="60" height="18" rx="9" fill="#2c2510" stroke="#f7b733" stroke-opacity="0.7"/>
    <text x="410" y="1186" text-anchor="middle" class="statusBadge" fill="#f7b733">TARGET</text>
    <text x="475" y="1184" class="body">Real chargers (OCPP 1.6J) · admin runs the site from the operator console · charger sessions logged ·</text>
    <text x="475" y="1204" class="body">presentable billing data · runbooks finalized · pilot retrospective · NO driver onboarding during pilot</text>
    <text x="475" y="1226" class="bodyMuted">Demonstrable platform, admin-functionality only. Drivers + Issue Engine + commercial readiness all post-pilot.</text>
  </g>

  <!-- ============================================================ -->
  <!-- PHASE 3 — POST-PILOT BACKLOG (expanded)                      -->
  <!-- ============================================================ -->
  <g filter="url(#shadow)">
    <rect x="70" y="1300" width="1660" height="500" rx="20" fill="url(#bandPost)" stroke="#b894ff" stroke-opacity="0.45" stroke-width="1.2"/>
  </g>
  <rect x="70" y="1300" width="6" height="500" rx="3" fill="#b894ff"/>

  <text x="100" y="1345" class="phase">POST-PILOT · BACKLOG</text>
  <text x="100" y="1368" class="phaseSub">Items pulled from pilot scope. Tags A–F unchanged in identity; B and D expanded to absorb the entire deferred sprints (was just login + advanced rules; now all of Driver Experience + all of Issue Engine).</text>

  <!-- LEFT COLUMN -->

  <g>
    <text x="100" y="1414" class="topicLabel">A · ROAMING</text>
    <text x="100" y="1434" class="topicItem">• eMSP endpoints (let our drivers charge at partner CPOs)</text>
    <text x="100" y="1454" class="topicItem">• OCPI token push to roaming partners</text>
    <text x="100" y="1474" class="topicItem">• OCPP 2.0.1 adapter</text>
  </g>

  <g>
    <text x="100" y="1514" class="topicLabel">B · DRIVER EXPERIENCE  (expanded — entire sprint)</text>
    <text x="100" y="1534" class="topicItemNew">• Driver self-signup, login (any kind), driver PWA shell</text>
    <text x="100" y="1554" class="topicItemNew">• Auðkenni electronic-ID (OIDC) · QR-code session start</text>
    <text x="100" y="1574" class="topicItemNew">• Family groups · employer reimbursement workflow</text>
    <text x="100" y="1594" class="topicItem">  Pilot uses admin-created driver records only; no driver-facing surface.</text>
  </g>

  <g>
    <text x="100" y="1634" class="topicLabel">C · MULTI-CURRENCY</text>
    <text x="100" y="1654" class="topicItem">• EUR + per-locale variants on top of the ISK-only pilot</text>
  </g>

  <!-- RIGHT COLUMN -->

  <g>
    <text x="930" y="1414" class="topicLabel">D · ISSUE ENGINE  (expanded — entire sprint)</text>
    <text x="930" y="1434" class="topicItemNew">• Five basic detection rules · ticket workflow · helper role</text>
    <text x="930" y="1454" class="topicItemNew">• Charger lifetime history · operator console issue pages</text>
    <text x="930" y="1474" class="topicItemNew">• Advanced detection · smart routing · ML categorization</text>
    <text x="930" y="1494" class="topicItem">  Pilot operator diagnoses by hand from raw event log.</text>
  </g>

  <g>
    <text x="930" y="1534" class="topicLabel">E · REAL BILLING</text>
    <text x="930" y="1554" class="topicItem">• Monthly invoice generation · billing transactions · statements · employer reimbursement · PDF invoices</text>
  </g>

  <g>
    <text x="930" y="1594" class="topicLabel">F · COMMERCE + COMPLIANCE</text>
    <text x="930" y="1614" class="topicItem">• Payment provider integration · dunning workflow</text>
    <text x="930" y="1634" class="topicItem">• EU residency verification ceremony (CF Data Localization + Neon EU posture stays in place)</text>
  </g>

  <!-- Open questions callout -->
  <g>
    <rect x="90" y="1700" width="1620" height="80" rx="10" fill="#1c1d2a" stroke="#ffd97a" stroke-opacity="0.55" stroke-width="1.2"/>
    <rect x="90" y="1700" width="4" height="80" rx="2" fill="#ffd97a"/>
    <text x="110" y="1726" class="topicLabel" fill="#ffd97a">DECISIONS PENDING — needed before source of truth is updated</text>
    <text x="110" y="1748" class="body">  1 · CPO == Organisation? Same row in V3 schema (recommended yes).</text>
    <text x="110" y="1768" class="body">  2 · Circuit — add back to schema (CPMS shape) or stay flat? Affects Sprint 2 milestone 2.6 + ADR.</text>
    <text x="900" y="1748" class="body">  3 · Admin billing — read-only dashboard (matches admin-only pilot) confirmed?</text>
    <text x="900" y="1768" class="body">  4 · This rev — add Zaptec to Sprint 2, add Data Lifecycle as Sprint 4, push Driver Exp + Issue Engine post-pilot — confirmed?</text>
  </g>

  <!-- FOOTER -->
  <text x="90" y="1842" class="footer">Source: E:\Claude\Straumvakt docs · roadmap-vertical-table.svg · pilot scope rev 2 (admin-only) — PROVISIONAL, awaiting four decisions.</text>
  <text x="90" y="1864" class="footer">Pilot is now 11 sprints (−1, 0, 1 done; 2–10 to go). Was 12 in v1 rescope; reduced by Driver Exp + Issue Engine removals, increased by Zaptec + Data Lifecycle additions.</text>
</svg>
