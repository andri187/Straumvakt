<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1080" viewBox="0 0 1480 1080" role="img" aria-labelledby="title desc">
  <title id="title">Straumvakt scope at 2026-05-03</title>
  <desc id="desc">Foundation already shipped through Sprint 4. V3 plan in flight Sprints 5 through 11 (cost engine is Sprint 8). DC readiness track is additive on top of V3. Issue Engine and other items are explicitly post-pilot. The gbtNotes scale-to-4000 plan is a re-framing of V3 Sprints 5 through 11, not a separate track.</desc>
  <defs>
    <style>
      .bg { fill: #08111f; }
      .panel-done { fill: #10251f; stroke: #2c5847; stroke-width: 1.5; rx: 8; }
      .panel-active { fill: #16352a; stroke: #4ade80; stroke-width: 2; rx: 8; }
      .panel-v3 { fill: #0f1b2d; stroke: #2b3c58; stroke-width: 1.5; rx: 8; }
      .panel-v3-cost { fill: #1a2a44; stroke: #fbbf24; stroke-width: 2.4; rx: 8; }
      .panel-dc { fill: #241a33; stroke: #594178; stroke-width: 1.5; rx: 8; }
      .panel-oos { fill: #2a2110; stroke: #6a5428; stroke-width: 1.5; rx: 8; }
      .panel-oos-issue { fill: #38250f; stroke: #d97706; stroke-width: 2; rx: 8; }
      .lane-done { fill: #0a1d18; stroke: #1f3a30; stroke-width: 1; rx: 12; }
      .lane-v3 { fill: #0a1320; stroke: #1f2c44; stroke-width: 1; rx: 12; }
      .lane-dc { fill: #19112a; stroke: #3a2c54; stroke-width: 1; rx: 12; }
      .lane-oos { fill: #1a1408; stroke: #3a2e15; stroke-width: 1; rx: 12; }

      .text { fill: #e7edf7; font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .muted { fill: #a8b3c4; font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .tiny { fill: #b8c4d6; font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 12px; }
      .card-id { fill: #ffffff; font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 17px; font-weight: 700; }
      .card-id-cost { fill: #fde68a; font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 17px; font-weight: 800; }
      .card-text { fill: #d4dbe6; font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 12px; }
      .card-text-cost { fill: #fde68a; font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 600; }
      .lane-label { fill: #ffffff; font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 18px; font-weight: 700; }
      .lane-sub { fill: #94a3b8; font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 12px; }
      .title { fill: #ffffff; font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 30px; font-weight: 800; }
      .sub { fill: #a8b3c4; font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 14px; }

      .arrow-dep { stroke: #fbbf24; stroke-width: 2.4; fill: none; marker-end: url(#arrow-dep); stroke-dasharray: 8 6; }
      .badge-done { fill: #4ade80; }
      .badge-active { fill: #fbbf24; }
      .badge-planned { fill: #7dd3fc; }
      .badge-cost { fill: #fbbf24; }
      .badge-dc { fill: #c084fc; }
      .badge-oos { fill: #d97706; }
    </style>
    <marker id="arrow-dep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect class="bg" width="1480" height="1080"/>

  <!-- Title -->
  <text class="title" x="40" y="50">Straumvakt — scope at 2026-05-03</text>
  <text class="sub" x="40" y="78">Foundation done through Sprint 4. V3 plan Sprints 5–11 in flight (Sprint 8 = cost engine). DC track is additive. Issue Engine is post-pilot.</text>

  <!-- Legend -->
  <g transform="translate(900, 22)">
    <rect width="540" height="68" rx="8" fill="#0c1726" stroke="#243349" stroke-width="1"/>
    <circle class="badge-done" cx="20" cy="22" r="6"/>
    <text class="tiny" x="32" y="26">done</text>
    <circle class="badge-active" cx="90" cy="22" r="6"/>
    <text class="tiny" x="102" y="26">active</text>
    <circle class="badge-planned" cx="160" cy="22" r="6"/>
    <text class="tiny" x="172" y="26">planned (V3 Sprint 6–11)</text>
    <circle class="badge-cost" cx="340" cy="22" r="6"/>
    <text class="tiny" x="352" y="26">cost engine (S8)</text>
    <circle class="badge-dc" cx="20" cy="50" r="6"/>
    <text class="tiny" x="32" y="54">planned (DC track, additive)</text>
    <circle class="badge-oos" cx="220" cy="50" r="6"/>
    <text class="tiny" x="232" y="54">post-pilot / out of scope</text>
    <line x1="380" y1="50" x2="420" y2="50" stroke="#fbbf24" stroke-width="2.4" stroke-dasharray="8 6"/>
    <text class="tiny" x="428" y="54">substrate dependency</text>
  </g>

  <!-- ====== FOUNDATION LANE ====== -->
  <rect class="lane-done" x="30" y="110" width="1420" height="150"/>
  <text class="lane-label" x="50" y="140">Foundation — shipped (Sprints −1 through 4)</text>
  <text class="lane-sub" x="50" y="160">Login shell, V3 schema, OCPP 1.6J gateway, admin onboarding (Zaptec OAuth + cost-center splitting), identity foundation (polymorphic IdToken), membership + permissions (RBAC, 40 verbs).</text>

  <!-- 6 cards single row -->
  <g transform="translate(50, 180)">
    <rect class="panel-done" x="0" y="0" width="220" height="68"/>
    <text class="card-id" x="14" y="26">Sprint −1</text>
    <text class="card-text" x="14" y="46">Login shell + dev/staging/prod</text>
    <text class="card-text" x="14" y="62">Admin HMAC session</text>

    <rect class="panel-done" x="232" y="0" width="220" height="68"/>
    <text class="card-id" x="246" y="26">Sprint 0</text>
    <text class="card-text" x="246" y="46">V3 schema + repos</text>
    <text class="card-text" x="246" y="62">Money as BIGINT minor units</text>

    <rect class="panel-done" x="464" y="0" width="220" height="68"/>
    <text class="card-id" x="478" y="26">Sprint 1</text>
    <text class="card-text" x="478" y="46">OCPP 1.6J foundation</text>
    <text class="card-text" x="478" y="62">Gateway, identity DOs, outbox</text>

    <rect class="panel-done" x="696" y="0" width="220" height="68"/>
    <text class="card-id" x="710" y="26">Sprint 2</text>
    <text class="card-text" x="710" y="46">Onboarding + cost centers</text>
    <text class="card-text" x="710" y="62">Zaptec OAuth, 8 cost factors</text>

    <rect class="panel-done" x="928" y="0" width="220" height="68"/>
    <text class="card-id" x="942" y="26">Sprint 3</text>
    <text class="card-text" x="942" y="46">Identity foundation</text>
    <text class="card-text" x="942" y="62">Polymorphic IdToken (ADR 0015)</text>

    <rect class="panel-done" x="1160" y="0" width="220" height="68"/>
    <text class="card-id" x="1174" y="26">Sprint 4</text>
    <text class="card-text" x="1174" y="46">Membership + permissions</text>
    <text class="card-text" x="1174" y="62">RBAC, 40 verbs, 13 bundles</text>
  </g>

  <!-- Substrate dependency arrow from foundation to V3 -->
  <path class="arrow-dep" d="M 740 260 L 740 295"/>

  <!-- ====== V3 IN-FLIGHT LANE ====== -->
  <rect class="lane-v3" x="30" y="300" width="1420" height="280"/>
  <text class="lane-label" x="50" y="330">V3 plan — in flight (Sprints 5 through 11, per ADR 0017)</text>
  <text class="lane-sub" x="50" y="350">The gbtNotes scale-to-4000-chargers plan is a re-framing of these same sprints, not a separate track. Source: docs/architecture/STRAUMVAKT_V3_DELIVERY_PLAN.md §2.</text>

  <!-- Row 1: Sprint 5 (active), 6, 7, 8 (cost - highlighted) -->
  <g transform="translate(50, 370)">
    <rect class="panel-active" x="0" y="0" width="340" height="84"/>
    <circle class="badge-active" cx="325" cy="14" r="5"/>
    <text class="card-id" x="14" y="26">Sprint 5 — Queue ingest + invite (active)</text>
    <text class="card-text" x="14" y="46">CF Queue + DLQ in front of inbound OCPP events</text>
    <text class="card-text" x="14" y="62">Idempotent consumer keyed by eventId</text>
    <text class="card-text" x="14" y="78">Parallel: invite-flow MVP, bootstrap-admin User row</text>

    <rect class="panel-v3" x="352" y="0" width="340" height="84"/>
    <text class="card-id" x="366" y="26">Sprint 6 — Data platform decision</text>
    <text class="card-text" x="366" y="46">ADR 0018: data-product taxonomy</text>
    <text class="card-text" x="366" y="62">Neon-with-partitioning vs Timescale</text>
    <text class="card-text" x="366" y="78">ORM boundary; R2 layout — no code, decision only</text>

    <rect class="panel-v3" x="704" y="0" width="340" height="84"/>
    <text class="card-id" x="718" y="26">Sprint 7 — Hot ingest + retention + R2</text>
    <text class="card-text" x="718" y="46">Raw-SQL batched writes per ADR 0018</text>
    <text class="card-text" x="718" y="62">7-day raw_protocol retention; daily R2 archive</text>
    <text class="card-text" x="718" y="78">Aggregate + report-ready tables populated</text>

    <rect class="panel-v3-cost" x="1056" y="0" width="340" height="84"/>
    <circle class="badge-cost" cx="1382" cy="14" r="5"/>
    <text class="card-id-cost" x="1070" y="26">Sprint 8 — Cost engine</text>
    <text class="card-text-cost" x="1070" y="46">Tariff Engine + Billing Dashboard</text>
    <text class="card-text-cost" x="1070" y="62">Pure-function engine, plan-priority resolver</text>
    <text class="card-text-cost" x="1070" y="78">CustomerPlan + ChargerServicePlan, ISK only</text>
  </g>

  <!-- Row 2: Sprint 9, 10, 11 -->
  <g transform="translate(50, 478)">
    <rect class="panel-v3" x="0" y="0" width="450" height="84"/>
    <text class="card-id" x="14" y="26">Sprint 9 — Outbound cmds + load test</text>
    <text class="card-text" x="14" y="46">Outbox state machine with retry semantics</text>
    <text class="card-text" x="14" y="62">Gateway command-result event ingest</text>
    <text class="card-text" x="14" y="78">Simulator 100 → 500 → 1000 → 4000 chargers</text>

    <rect class="panel-v3" x="462" y="0" width="450" height="84"/>
    <text class="card-id" x="476" y="26">Sprint 10 — Observability + security</text>
    <text class="card-text" x="476" y="46">Dashboards, alerts, runbooks (14 failure modes)</text>
    <text class="card-text" x="476" y="62">Postgres RLS as defense-in-depth</text>
    <text class="card-text" x="476" y="78">AuditAction append-only; MFA on PlatformGrant</text>

    <rect class="panel-v3" x="924" y="0" width="472" height="84"/>
    <text class="card-id" x="938" y="26">Sprint 11 — Production cutover + pilot go-live</text>
    <text class="card-text" x="938" y="46">CF prod Workers, Neon prod, R2, Hyperdrive, Queues + DLQs</text>
    <text class="card-text" x="938" y="62">Migration dry-run; final 4k-staging load test</text>
    <text class="card-text" x="938" y="78">Rollback paths; go/no-go; pilot ramp ~50 chargers</text>
  </g>

  <!-- Substrate dependency arrow from V3 (sprints 5-7) to DC -->
  <path class="arrow-dep" d="M 740 580 L 740 615"/>
  <text class="lane-sub" x="755" y="603">queue + hot ingest required for DC volume (S5–S7 must precede DC1)</text>

  <!-- ====== DC READINESS LANE ====== -->
  <rect class="lane-dc" x="30" y="620" width="1420" height="270"/>
  <text class="lane-label" x="50" y="650">DC readiness track — additive on top of V3 (gbtnotes DC)</text>
  <text class="lane-sub" x="50" y="670">Source: gbtNotes/dc-readiness-sprint-plan.md. Minimum viable DC cabinet = DC1–DC4 + DC7 + DC8 + DC10 (P&amp;C and Hubject deferred to later cabinets).</text>

  <!-- DC row 1: DC1-DC6 -->
  <g transform="translate(50, 690)">
    <rect class="panel-dc" x="0" y="0" width="220" height="78"/>
    <text class="card-id" x="14" y="26">DC1 — OCPP 2.0.1</text>
    <text class="card-text" x="14" y="46">Dual-version dispatch</text>
    <text class="card-text" x="14" y="62">TransactionEvent, MeterValues+SoC</text>

    <rect class="panel-dc" x="232" y="0" width="220" height="78"/>
    <text class="card-id" x="246" y="26">DC2 — Connector anchor</text>
    <text class="card-text" x="246" y="46">Authorise per plug</text>
    <text class="card-text" x="246" y="62">Per-connector billing</text>

    <rect class="panel-dc" x="464" y="0" width="220" height="78"/>
    <text class="card-id" x="478" y="26">DC3 — Cabinet envelope</text>
    <text class="card-text" x="478" y="46">Power allocator</text>
    <text class="card-text" x="478" y="62">Dispenser kW arbitration</text>

    <rect class="panel-dc" x="696" y="0" width="220" height="78"/>
    <text class="card-id" x="710" y="26">DC4 — Connector limits</text>
    <text class="card-text" x="710" y="46">maxCurrentA + curve</text>
    <text class="card-text" x="710" y="62">CCS / CHAdeMO physics</text>

    <rect class="panel-dc" x="928" y="0" width="220" height="78"/>
    <text class="card-id" x="942" y="26">DC5 — SmartCharging</text>
    <text class="card-text" x="942" y="46">ChargingProfile pipeline</text>
    <text class="card-text" x="942" y="62">Composition stack</text>

    <rect class="panel-dc" x="1160" y="0" width="220" height="78"/>
    <text class="card-id" x="1174" y="26">DC6 — Plug &amp; Charge</text>
    <text class="card-text" x="1174" y="46">ISO 15118 contract certs</text>
    <text class="card-text" x="1174" y="62">Hubject EVSE CHECK</text>
  </g>

  <!-- DC row 2: DC7-DC12 -->
  <g transform="translate(50, 788)">
    <rect class="panel-dc" x="0" y="0" width="220" height="78"/>
    <text class="card-id" x="14" y="26">DC7 — Tariff dictionary</text>
    <text class="card-text" x="14" y="46">kW + kWh + idle + ToU</text>
    <text class="card-text" x="14" y="62">Validator + UI editor</text>

    <rect class="panel-dc" x="232" y="0" width="220" height="78"/>
    <text class="card-id" x="246" y="26">DC8 — Ad-hoc payment</text>
    <text class="card-text" x="246" y="46">Card terminal at dispenser</text>
    <text class="card-text" x="246" y="62">EU AFIR Art. 5 compliance</text>

    <rect class="panel-dc" x="464" y="0" width="220" height="78"/>
    <text class="card-id" x="478" y="26">DC9 — Hubject roaming</text>
    <text class="card-text" x="478" y="46">CPO interface, OICP</text>
    <text class="card-text" x="478" y="62">Foreign-MO sessions</text>

    <rect class="panel-dc" x="696" y="0" width="220" height="78"/>
    <text class="card-id" x="710" y="26">DC10 — Vendor adapter</text>
    <text class="card-text" x="710" y="46">First DC vendor live</text>
    <text class="card-text" x="710" y="62">Autel DH480 or Kempower</text>

    <rect class="panel-dc" x="928" y="0" width="220" height="78"/>
    <text class="card-id" x="942" y="26">DC11 — DC ops</text>
    <text class="card-text" x="942" y="46">Cooling, isolation, terminal</text>
    <text class="card-text" x="942" y="62">Dashboards, alerts, runbooks</text>

    <rect class="panel-dc" x="1160" y="0" width="220" height="78"/>
    <text class="card-id" x="1174" y="26">DC12 — DC load test</text>
    <text class="card-text" x="1174" y="46">2.0.1 traffic shapes</text>
    <text class="card-text" x="1174" y="62">SoC sampling, P&amp;C load</text>
  </g>

  <!-- ====== POST-PILOT / OUT OF SCOPE ====== -->
  <rect class="lane-oos" x="30" y="910" width="1420" height="155"/>
  <text class="lane-label" x="50" y="940">Post-pilot / out of scope (today)</text>

  <!-- Issue Engine highlighted card -->
  <g transform="translate(50, 955)">
    <rect class="panel-oos-issue" x="0" y="0" width="340" height="92"/>
    <circle class="badge-oos" cx="324" cy="14" r="5"/>
    <text class="card-id" x="14" y="26">Issue Engine</text>
    <text class="card-text" x="14" y="46">Per ADR 0006: moved entirely to post-pilot</text>
    <text class="card-text" x="14" y="62">Schema hooks exist (cost centers carry</text>
    <text class="card-text" x="14" y="78">beneficiary_org_id), nothing wired</text>

    <!-- Other out-of-scope items -->
    <rect class="panel-oos" x="352" y="0" width="340" height="92"/>
    <text class="card-id" x="366" y="26">Driver mobile app for DC</text>
    <text class="card-text" x="366" y="46">Active SoC, projected finish, receipt</text>
    <text class="card-text" x="366" y="62">Own track, sequenced after</text>
    <text class="card-text" x="366" y="78">DC2 (connector) + DC8 (payment)</text>

    <rect class="panel-oos" x="704" y="0" width="340" height="92"/>
    <text class="card-id" x="718" y="26">HPC certification + licensing</text>
    <text class="card-text" x="718" y="46">CCS PnP, ChaoJi 2.0</text>
    <text class="card-text" x="718" y="62">CPO regulator licensing</text>
    <text class="card-text" x="718" y="78">Operator concern, post-pilot</text>

    <rect class="panel-oos" x="1056" y="0" width="340" height="92"/>
    <text class="card-id" x="1070" y="26">Other deferred</text>
    <text class="card-text" x="1070" y="46">ClickHouse fleet analytics</text>
    <text class="card-text" x="1070" y="62">Easee / Kempower / Tritium adapters</text>
    <text class="card-text" x="1070" y="78">until vendor pilot is committed</text>
  </g>
</svg>
