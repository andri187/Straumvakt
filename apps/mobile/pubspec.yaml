name: straumvakt_app
description: Straumvakt driver app — wired to /api/driver/* on the deployed API Worker.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  flutter_blue_plus: ^1.34.5
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/straumvakt_logo_mark.png"
  adaptive_icon_background: "#010B13"  # BrandPalette.midnight
  adaptive_icon_foreground: "assets/images/straumvakt_logo_mark.png"
  remove_alpha_ios: true
  background_color_ios: "#010B13"
