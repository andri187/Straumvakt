org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Project lives on E:\ but the pub cache (plugin sources) is on C:\. Kotlin's
# incremental compiler crashes relativising paths across drive roots
# ("Could not close incremental caches … different roots"). Disable
# incremental Kotlin compilation to avoid the cross-drive cache bug.
kotlin.incremental=false
