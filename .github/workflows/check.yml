# Runs the offline correctness checks that already existed in the repo but
# were never wired to anything. Two of them were silently not running:
#
#   - `typecheck` was bare `tsc --noEmit`, which uses the root tsconfig and
#     excludes apps/**, gateway/** and packages/** — about a third of the
#     codebase went unverified while the check reported success (4130daf).
#   - `check:schema-parity` existed but nothing called it, so the two Prisma
#     schemas drifted (ArchiveWatermark missing from apps/api) unnoticed.
#
# `check:migrations` is still deliberately NOT here — now for a checked
# reason rather than an assumed one.
#
# It needs a live DATABASE_URL, and no such secret exists in this repo: the
# only secret any workflow references is FLY_API_TOKEN_ZAPTEC_CONSUMER.
# Adding one is a decision, not a wiring chore — this workflow triggers on
# `push: **` and on `pull_request`, so a staging database credential would be
# reachable from every branch and every PR run.
#
# Two things changed on 2026-08-08 that whoever revisits this needs to know:
#
#   1. Until then the check could not have caught anything, wired or not.
#      prisma.config.ts set no `migrations.path`, so after the move to a
#      schema folder Prisma looked for migrations next to the datasource file
#      (prisma/schema/migrations — absent) rather than prisma/migrations, and
#      `migrate status` answered "No migration found in prisma/migrations"
#      then "Database schema is up to date!" and exited 0. Green regardless of
#      reality. Fixed in the same commit as this comment — and it is the same
#      failure as the two above: a check that ran and proved nothing.
#
#   2. Now that it works, it exits NON-ZERO while migrations are pending, and
#      two are pending against staging today
#      (20260807003000_drop_issues_scaffold and
#      20260807120000_drop_never_used_tables — both already applied by hand,
#      neither recorded). Wiring it in before those are reconciled turns CI
#      red on every branch immediately.
#
# Order, therefore: reconcile those two first, then decide the secret, then
# add to the job below:
#
#     - run: npm run check:migrations
#       env:
#         DATABASE_URL: ${{ secrets.DATABASE_URL }}
#
# Until then, run it by hand against staging before deploying.
name: check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `npm ci` and `cache: npm` both require a committed lockfile.
      # package-lock.json is gitignored here (.gitignore:51), a deliberate
      # choice, so use `npm install` and forgo the cache rather than
      # reverse it. Costs ~30s per run; revisit if that becomes annoying.
      - run: npm install --no-audit --no-fund
      # The workspaces import `straumvakt-prisma-cf-client/client`, a
      # Workers-targeted Prisma client built by scripts/compile-cf-prisma.sh
      # and not committed. Without this, typecheck fails with TS2307 on
      # every file that touches the database.
      - run: npm run db:generate
      - run: npm run check
