# Retired by the approved legacy cloud cleanup on 2026-10-26.
# Re-enabling requires a reviewed environment and explicit deployment approval.
# Keep the job disabled even for manual dispatch; old targets are retired.

name: Deploy zaptec-consumer

on:
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ false }}
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    concurrency: deploy-zaptec-consumer
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        working-directory: apps/zaptec-consumer
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ZAPTEC_CONSUMER }}
