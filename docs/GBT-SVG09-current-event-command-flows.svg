<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
 <title id="title">Straumvakt current event and command flows</title><desc id="desc">Current OCPP and Zaptec vendor data flows, including the separation between event ingestion and device commands.</desc>
 <style>text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:27px;font-weight:700}.sub{font-size:14px;fill:#52616b}.h{font-size:17px;font-weight:700}.b{font-size:13px}.s{font-size:12px;fill:#52616b}.box{stroke:#22313f;stroke-width:1.5;rx:8}.blue{stroke:#276f86;stroke-width:3;fill:none;marker-end:url(#a)}.green{stroke:#27785c;stroke-width:3;fill:none;marker-end:url(#g)}.amber{stroke:#b7771e;stroke-width:2.5;fill:none;stroke-dasharray:8 6;marker-end:url(#m)}.lane{fill:#f7f9fa;stroke:#b6c2c9;stroke-width:1.2;rx:10}</style>
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#276f86"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#27785c"/></marker><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b7771e"/></marker></defs>
 <rect width="1500" height="900" fill="#fff"/><text x="52" y="55" class="title">Current charging data and command flows</text><text x="52" y="80" class="sub">The code deliberately separates charger-originated facts from requests sent to a charger. Zaptec AMQP is a sync trigger, not the canonical event payload.</text>
 <rect x="42" y="116" width="1416" height="332" class="lane"/><text x="68" y="148" class="h">A. OCPP station event path: charger reports a fact</text>
 <rect x="76" y="197" width="176" height="96" class="box" fill="#f9efe0"/><text x="96" y="230" class="h">Charge point</text><text x="96" y="253" class="b">OCPP 1.6 message</text><text x="96" y="274" class="s">Status, meter, tx event</text>
 <rect x="353" y="197" width="195" height="96" class="box" fill="#e8f1e5"/><text x="374" y="230" class="h">Gateway Durable Object</text><text x="374" y="253" class="b">Validate and sequence</text><text x="374" y="274" class="s">Per identity connection state</text>
 <rect x="653" y="197" width="182" height="96" class="box" fill="#e8f1e5"/><text x="674" y="230" class="h">OCPP event queue</text><text x="674" y="253" class="b">Retries and DLQ</text><text x="674" y="274" class="s">Async boundary</text>
 <rect x="941" y="197" width="189" height="96" class="box" fill="#dceef1"/><text x="962" y="230" class="h">API consumer</text><text x="962" y="253" class="b">Normalize / authorize</text><text x="962" y="274" class="s">Session and state updates</text>
 <rect x="1233" y="197" width="170" height="96" class="box" fill="#eee8f5"/><text x="1253" y="230" class="h">Postgres</text><text x="1253" y="253" class="b">Operational record</text><text x="1253" y="274" class="s">Event / session data</text>
 <path d="M252 245H353" class="blue"/><path d="M548 245H653" class="blue"/><path d="M835 245H941" class="blue"/><path d="M1130 245H1233" class="blue"/>
 <text x="272" y="226" class="s">WebSocket</text><text x="562" y="226" class="s">enqueue</text><text x="845" y="226" class="s">consume</text><text x="1146" y="226" class="s">write</text>
 <rect x="42" y="488" width="1416" height="348" class="lane"/><text x="68" y="520" class="h">B. Command and vendor observation paths</text>
 <rect x="76" y="576" width="170" height="95" class="box" fill="#dceef1"/><text x="96" y="609" class="h">Driver / console</text><text x="96" y="632" class="b">Start, stop, admin action</text><text x="96" y="653" class="s">HTTPS request</text>
 <rect x="330" y="576" width="186" height="95" class="box" fill="#dceef1"/><text x="350" y="609" class="h">API worker</text><text x="350" y="632" class="b">Authorize and persist intent</text><text x="350" y="653" class="s">Returns 202 for async work</text>
 <rect x="603" y="576" width="185" height="95" class="box" fill="#e8f1e5"/><text x="623" y="609" class="h">Outbound command queue</text><text x="623" y="632" class="b">Dispatchable command</text><text x="623" y="653" class="s">Retry / DLQ configuration</text>
 <rect x="875" y="576" width="170" height="95" class="box" fill="#e8f1e5"/><text x="895" y="609" class="h">Gateway</text><text x="895" y="632" class="b">Dispatch to live socket</text><text x="895" y="653" class="s">Identity-specific DO</text>
 <rect x="1131" y="576" width="170" height="95" class="box" fill="#f9efe0"/><text x="1151" y="609" class="h">Charge point</text><text x="1151" y="632" class="b">Accepts or rejects</text><text x="1151" y="653" class="s">Result returns through OCPP</text>
 <path d="M246 624H330" class="green"/><path d="M516 624H603" class="green"/><path d="M788 624H875" class="green"/><path d="M1045 624H1131" class="green"/>
 <rect x="1035" y="728" width="210" height="70" class="box" fill="#fff3d9"/><text x="1055" y="757" class="h">Zaptec AMQP / Fly</text><text x="1055" y="779" class="s">Notification triggers REST claim check</text>
 <path d="M1035 763H516" class="amber"/><text x="698" y="749" class="s">conditional vendor sync trigger; API fetches authoritative details</text>
 <rect x="55" y="860" width="18" height="12" fill="#276f86"/><text x="82" y="871" class="s">Station fact / telemetry</text><rect x="298" y="860" width="18" height="12" fill="#27785c"/><text x="325" y="871" class="s">Requested control command</text><line x1="574" y1="866" x2="616" y2="866" class="amber"/><text x="626" y="871" class="s">Vendor-triggered synchronization</text>
</svg>
