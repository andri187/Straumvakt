<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Straumvakt Driver Access</title>
  <desc id="desc">Driver authentication architecture for RFID Card, Mobile Tap, and App Start.</desc>
  <defs>
    <style>
      .bg{fill:#08111f}.box{fill:#0f1b2d;stroke:#3b526f;stroke-width:1.5;rx:8}.green{fill:#10251f;stroke:#3d8b68;stroke-width:1.5;rx:8}.purple{fill:#241a33;stroke:#7551a3;stroke-width:1.5;rx:8}.gold{fill:#2b2414;stroke:#c59b3d;stroke-width:1.5;rx:8}.red{fill:#2a171b;stroke:#a94b5b;stroke-width:1.5;rx:8}
      .title{fill:#fff;font:800 34px Inter,Segoe UI,Arial}.label{fill:#fff;font:700 19px Inter,Segoe UI,Arial}.small{fill:#aebbd0;font:13px Inter,Segoe UI,Arial}.tiny{fill:#98a6ba;font:12px Inter,Segoe UI,Arial}
      .a{stroke:#7dd3fc;stroke-width:2.2;fill:none;marker-end:url(#arr)}.b{stroke:#fbbf24;stroke-width:2.2;fill:none;marker-end:url(#arr2)}.c{stroke:#86efac;stroke-width:2.2;fill:none;marker-end:url(#arr3)}.d{stroke-dasharray:7 7}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7dd3fc"/></marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#fbbf24"/></marker>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#86efac"/></marker>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="48" y="58">Driver Access</text>
  <text class="small" x="48" y="86">Three authentication methods, one driver credential and authorization model. No QR path.</text>

  <rect class="box" x="60" y="140" width="220" height="92"/>
  <text class="label" x="88" y="176">RFID Card</text>
  <text class="small" x="88" y="204">Physical card tap</text>

  <rect class="box" x="60" y="295" width="220" height="92"/>
  <text class="label" x="88" y="331">Mobile Tap</text>
  <text class="small" x="88" y="359">Phone-presented credential</text>

  <rect class="box" x="60" y="520" width="220" height="92"/>
  <text class="label" x="88" y="556">App Start</text>
  <text class="small" x="88" y="584">Driver presses Start</text>

  <rect class="purple" x="360" y="210" width="235" height="120"/>
  <text class="label" x="390" y="250">Charger Reader</text>
  <text class="small" x="390" y="280">Reads idTag-like credential</text>
  <text class="tiny" x="390" y="304">RFID and Mobile Tap path</text>

  <rect class="green" x="360" y="485" width="235" height="120"/>
  <text class="label" x="390" y="525">Driver API</text>
  <text class="small" x="390" y="555">Authenticates app session</text>
  <text class="tiny" x="390" y="579">App Start path</text>

  <rect class="green" x="675" y="250" width="250" height="130"/>
  <text class="label" x="705" y="290">Driver Access Service</text>
  <text class="small" x="705" y="320">Resolve credential</text>
  <text class="small" x="705" y="344">Check status and contract</text>
  <text class="small" x="705" y="368">Return Accepted or Rejected</text>

  <rect class="gold" x="675" y="485" width="250" height="120"/>
  <text class="label" x="705" y="525">Outbound Command</text>
  <text class="small" x="705" y="555">RemoteStartTransaction</text>
  <text class="tiny" x="705" y="579">Queue to gateway</text>

  <rect class="gold" x="985" y="160" width="170" height="95"/>
  <text class="label" x="1012" y="198">Database</text>
  <text class="small" x="1012" y="226">DriverCredential</text>

  <rect class="purple" x="985" y="330" width="170" height="95"/>
  <text class="label" x="1012" y="368">OCPP</text>
  <text class="small" x="1012" y="396">Authorize / Start</text>

  <rect class="red" x="985" y="505" width="170" height="95"/>
  <text class="label" x="1012" y="543">Audit</text>
  <text class="small" x="1012" y="571">Issue, revoke, use</text>

  <path class="a" d="M280 186 C315 205 330 235 360 255"/>
  <path class="a" d="M280 341 C315 325 330 295 360 285"/>
  <path class="c" d="M595 270 L675 315"/>
  <path class="c" d="M925 315 C955 285 970 245 985 208"/>
  <path class="c" d="M925 330 L985 378"/>
  <path class="a d" d="M925 360 C960 415 970 505 985 552"/>

  <path class="b" d="M280 566 L360 545"/>
  <path class="b" d="M595 545 L675 545"/>
  <path class="b" d="M925 545 C965 510 970 430 985 390"/>
  <path class="b d" d="M595 520 C640 455 675 405 720 380"/>

  <text class="tiny" x="310" y="238">tap</text>
  <text class="tiny" x="610" y="292">Authorize(idTag)</text>
  <text class="tiny" x="610" y="530">start request</text>
  <text class="tiny" x="760" y="450">app-start authorization</text>
  <text class="small" x="60" y="690">Key rule: RFID Card and Mobile Tap are charger-initiated; App Start is Straumvakt-initiated. All three resolve to the same driver identity.</text>
</svg>
