<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Straumvakt System Overview</title>
  <desc id="desc">Architecture overview of Straumvakt: operator UI, API worker, OCPP gateway, queues, and Neon Postgres.</desc>
  <defs>
    <style>
      .bg { fill: #08111f; }
      .panel { fill: #0f1b2d; stroke: #2b3c58; stroke-width: 1.5; rx: 8; }
      .panel2 { fill: #10251f; stroke: #2c5847; stroke-width: 1.5; rx: 8; }
      .panel3 { fill: #241a33; stroke: #594178; stroke-width: 1.5; rx: 8; }
      .panel4 { fill: #2a2110; stroke: #6a5428; stroke-width: 1.5; rx: 8; }
      .text { fill: #e7edf7; font-family: Inter, Segoe UI, Arial, sans-serif; }
      .muted { fill: #a8b3c4; font-family: Inter, Segoe UI, Arial, sans-serif; }
      .tiny { fill: #b8c4d6; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 13px; }
      .label { fill: #ffffff; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 700; }
      .title { fill: #ffffff; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 34px; font-weight: 800; }
      .arrow { stroke: #7dd3fc; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .arrow2 { stroke: #86efac; stroke-width: 2.2; fill: none; marker-end: url(#arrow2); }
      .arrow3 { stroke: #fbbf24; stroke-width: 2.2; fill: none; marker-end: url(#arrow3); }
      .dash { stroke-dasharray: 7 7; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#86efac"/>
    </marker>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="48" y="58">Straumvakt</text>
  <text class="muted" x="48" y="84" font-size="16">Charging operating platform: operator console, charger integrations, event log, billing and tenant operations.</text>

  <rect class="panel" x="48" y="130" width="240" height="150"/>
  <text class="label" x="72" y="168">Operator UI</text>
  <text class="tiny" x="72" y="198">Next.js app router</text>
  <text class="tiny" x="72" y="222">Admin console pages</text>
  <text class="tiny" x="72" y="246">Reference and diagnostics</text>

  <rect class="panel2" x="372" y="120" width="280" height="170"/>
  <text class="label" x="396" y="158">API Worker</text>
  <text class="tiny" x="396" y="188">Hono admin API</text>
  <text class="tiny" x="396" y="212">Tenant-scoped repositories</text>
  <text class="tiny" x="396" y="236">Prisma 7 Cloudflare client</text>
  <text class="tiny" x="396" y="260">Queue consumer and cron sweeper</text>

  <rect class="panel3" x="748" y="110" width="300" height="190"/>
  <text class="label" x="772" y="148">OCPP Gateway</text>
  <text class="tiny" x="772" y="178">Cloudflare Worker</text>
  <text class="tiny" x="772" y="202">WebSocket upgrade per charger</text>
  <text class="tiny" x="772" y="226">Durable Object per identity</text>
  <text class="tiny" x="772" y="250">Translates OCPP frames to events</text>
  <text class="tiny" x="772" y="274">Dispatches outbound commands</text>

  <rect class="panel4" x="748" y="392" width="300" height="150"/>
  <text class="label" x="772" y="430">Chargers</text>
  <text class="tiny" x="772" y="460">Zaptec, Easee, OCPP devices</text>
  <text class="tiny" x="772" y="484">Boot, status, sessions, meter values</text>
  <text class="tiny" x="772" y="508">Start, stop, reset, config commands</text>

  <rect class="panel2" x="374" y="382" width="278" height="180"/>
  <text class="label" x="398" y="420">Neon Postgres</text>
  <text class="tiny" x="398" y="450">18 logical schemas</text>
  <text class="tiny" x="398" y="474">Identity, tenancy, assets</text>
  <text class="tiny" x="398" y="498">OCPP, charging, billing</text>
  <text class="tiny" x="398" y="522">Events and audit log</text>

  <rect class="panel" x="48" y="394" width="240" height="150"/>
  <text class="label" x="72" y="432">Domain Model</text>
  <text class="tiny" x="72" y="462">Org -> Property -> Site</text>
  <text class="tiny" x="72" y="486">Installation -> Circuit</text>
  <text class="tiny" x="72" y="510">Station -> EVSE -> Connector</text>

  <rect class="panel3" x="372" y="618" width="280" height="88"/>
  <text class="label" x="396" y="654">Cloudflare Queues</text>
  <text class="tiny" x="396" y="684">Outbound command retries and async projection</text>

  <path class="arrow" d="M 288 205 C 322 205, 334 205, 372 205"/>
  <text class="tiny" x="304" y="190">HTTP API</text>

  <path class="arrow2" d="M 652 205 C 690 205, 706 205, 748 205"/>
  <text class="tiny" x="674" y="190">service binding</text>

  <path class="arrow3" d="M 898 392 L 898 300"/>
  <text class="tiny" x="914" y="348">WebSocket OCPP</text>

  <path class="arrow2" d="M 512 290 L 512 382"/>
  <text class="tiny" x="528" y="342">Prisma</text>

  <path class="arrow3 dash" d="M 512 562 L 512 618"/>
  <text class="tiny" x="528" y="596">async jobs</text>

  <path class="arrow" d="M 372 470 C 330 470, 318 470, 288 470"/>
  <text class="tiny" x="304" y="455">reads and writes</text>

  <path class="arrow3 dash" d="M 748 480 C 704 540, 662 616, 652 662"/>
  <text class="tiny" x="675" y="602">events</text>

  <rect x="48" y="628" width="240" height="78" rx="8" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <text class="text" x="72" y="660" font-size="17" font-weight="700">Core idea</text>
  <text class="tiny" x="72" y="686">One operating layer above OCPP, OEM APIs,</text>
  <text class="tiny" x="72" y="704">external CPMS, and read-only imports.</text>
</svg>
