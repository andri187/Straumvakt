<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc">
 <title id="title">Straumvakt current product surfaces</title><desc id="desc">Roles, interfaces and present functional maturity based on source review.</desc>
 <style>text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:27px;font-weight:700}.sub{font-size:14px;fill:#52616b}.h{font-size:17px;font-weight:700}.b{font-size:13px}.s{font-size:12px;fill:#52616b}.box{stroke:#22313f;stroke-width:1.5;rx:8}.line{stroke:#607987;stroke-width:2.5;fill:none;marker-end:url(#a)}.group{fill:#f5f8f9;stroke:#aab9c1;stroke-width:1.2;rx:12}</style>
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#607987"/></marker></defs><rect width="1500" height="850" fill="#fff"/>
 <text x="52" y="55" class="title">Current product surface and maturity</text><text x="52" y="80" class="sub">Green = implemented code path; amber = partial or non-production-facing; gray = repository model or route capability without a complete surface.</text>
 <rect x="42" y="118" width="270" height="592" class="group"/><text x="64" y="150" class="h">Actors</text>
 <rect x="72" y="190" width="210" height="80" class="box" fill="#dceef1"/><text x="94" y="222" class="h">Admin / operator</text><text x="94" y="246" class="s">Organization and fleet authority</text>
 <rect x="72" y="326" width="210" height="80" class="box" fill="#dceef1"/><text x="94" y="358" class="h">Host</text><text x="94" y="382" class="s">Property / site participant</text>
 <rect x="72" y="462" width="210" height="80" class="box" fill="#dceef1"/><text x="94" y="494" class="h">Driver</text><text x="94" y="518" class="s">Charging-session participant</text>
 <rect x="72" y="598" width="210" height="80" class="box" fill="#eceff1"/><text x="94" y="630" class="h">Contractor</text><text x="94" y="654" class="s">No dedicated role/surface found</text>
 <rect x="403" y="118" width="486" height="592" class="group"/><text x="425" y="150" class="h">Interfaces currently in the repository</text>
 <rect x="435" y="190" width="202" height="105" class="box" fill="#dceef1"/><text x="455" y="223" class="h">Web console</text><text x="455" y="246" class="b">Admin and operator routes</text><text x="455" y="268" class="s">Tenancy, sites, chargers, users,</text><text x="455" y="286" class="s">agreements, billing, onboarding</text>
 <rect x="675" y="190" width="182" height="105" class="box" fill="#fff3d9"/><text x="695" y="223" class="h">Host / public web</text><text x="695" y="246" class="b">Invites and applications</text><text x="695" y="268" class="s">Present as route/page family</text>
 <rect x="435" y="376" width="202" height="130" class="box" fill="#e8f1e5"/><text x="455" y="409" class="h">Flutter driver app</text><text x="455" y="432" class="b">Login, charger list, nearby BLE,</text><text x="455" y="450" class="b">session poll/start/stop, invite</text><text x="455" y="474" class="s">Settings screen is a visual preview;</text><text x="455" y="492" class="s">not a GATT settings implementation</text>
 <rect x="675" y="376" width="182" height="130" class="box" fill="#fff3d9"/><text x="695" y="409" class="h">Tap / NFC capability</text><text x="695" y="432" class="b">Tap-intent API + app client</text><text x="695" y="454" class="s">NFC reader code exists but is not</text><text x="695" y="472" class="s">wired into a current app screen</text><text x="695" y="490" class="s">Not one complete active feature</text>
 <rect x="435" y="584" width="422" height="85" class="box" fill="#eceff1"/><text x="455" y="617" class="h">No contractor mobile workflow found</text><text x="455" y="641" class="s">The data model contains broad operational concepts, but no dedicated contractor role or app surface was identified.</text>
 <rect x="1000" y="118" width="456" height="592" class="group"/><text x="1022" y="150" class="h">Authoritative control and data</text>
 <rect x="1032" y="190" width="392" height="93" class="box" fill="#eee8f5"/><text x="1052" y="222" class="h">Identity and tenancy</text><text x="1052" y="246" class="s">Users, organizations, memberships, roles, driver groups and access decisions</text>
 <rect x="1032" y="332" width="392" height="93" class="box" fill="#eee8f5"/><text x="1052" y="364" class="h">Infrastructure and charging</text><text x="1052" y="388" class="s">Properties, sites, assets, installations, OCPP identities, sessions and events</text>
 <rect x="1032" y="474" width="392" height="93" class="box" fill="#eee8f5"/><text x="1052" y="506" class="h">Commercial and operational</text><text x="1052" y="530" class="s">Agreements, tariffs, billing lines, invoices, evidence and issue-ticket models</text>
 <rect x="1032" y="616" width="392" height="52" class="box" fill="#eceff1"/><text x="1052" y="647" class="b">Database models do not alone prove a finished workflow or UI.</text>
 <path d="M282 230H435" class="line"/><path d="M282 366H675" class="line"/><path d="M282 502H435" class="line"/><path d="M637 442H1032" class="line"/><path d="M857 442H1032" class="line"/><path d="M282 638H435" class="line"/>
 <text x="54" y="776" class="s">Interpretation rule: this diagram measures source-backed capability, not whether every external service is deployed with production data.</text>
</svg>
