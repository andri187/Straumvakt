<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Straumvakt Command Flow</title>
  <desc id="desc">Outbound command flow from operator UI to charger and result event.</desc>
  <defs>
    <style>
      .bg{fill:#08111f}.box{fill:#0f1b2d;stroke:#3b526f;stroke-width:1.5;rx:8}.green{fill:#10251f;stroke:#3d8b68;stroke-width:1.5;rx:8}.purple{fill:#241a33;stroke:#7551a3;stroke-width:1.5;rx:8}.gold{fill:#2b2414;stroke:#c59b3d;stroke-width:1.5;rx:8}
      .title{fill:#fff;font:800 34px Inter,Segoe UI,Arial}.label{fill:#fff;font:700 19px Inter,Segoe UI,Arial}.small{fill:#aebbd0;font:13px Inter,Segoe UI,Arial}.num{fill:#08111f;font:800 15px Inter,Segoe UI,Arial}
      .a{stroke:#fbbf24;stroke-width:2.4;fill:none;marker-end:url(#arr)}.b{stroke:#86efac;stroke-width:2.2;fill:none;marker-end:url(#arr2);stroke-dasharray:7 7}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#fbbf24"/></marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#86efac"/></marker>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="48" y="58">Outbound Command Flow</text>
  <text class="small" x="48" y="86">An operator action becomes an outbox row, is dispatched through the gateway, and returns as an event.</text>

  <rect class="box" x="65" y="190" width="185" height="100"/><text class="label" x="97" y="230">UI Action</text><text class="small" x="97" y="258">stop, reset, unlock</text>
  <rect class="green" x="292" y="190" width="205" height="100"/><text class="label" x="324" y="230">API Worker</text><text class="small" x="324" y="258">authorize and enqueue</text>
  <rect class="gold" x="539" y="190" width="205" height="100"/><text class="label" x="571" y="230">Outbox Row</text><text class="small" x="571" y="258">pending command</text>
  <rect class="gold" x="786" y="190" width="205" height="100"/><text class="label" x="818" y="230">Queue</text><text class="small" x="818" y="258">retryable dispatch</text>

  <rect class="purple" x="786" y="410" width="205" height="100"/><text class="label" x="818" y="450">Gateway DO</text><text class="small" x="818" y="478">send OCPP call</text>
  <rect class="purple" x="539" y="410" width="205" height="100"/><text class="label" x="571" y="450">Charger</text><text class="small" x="571" y="478">call result or error</text>
  <rect class="green" x="292" y="410" width="205" height="100"/><text class="label" x="324" y="450">Result Event</text><text class="small" x="324" y="478">persist outcome</text>
  <rect class="box" x="65" y="410" width="185" height="100"/><text class="label" x="97" y="450">UI Status</text><text class="small" x="97" y="478">sent, acked, failed</text>

  <path class="a" d="M250 240 L292 240"/><path class="a" d="M497 240 L539 240"/><path class="a" d="M744 240 L786 240"/>
  <path class="a" d="M888 290 L888 410"/><path class="a" d="M786 460 L744 460"/><path class="b" d="M539 460 L497 460"/><path class="b" d="M292 460 L250 460"/>
  <circle cx="272" cy="240" r="16" fill="#fbbf24"/><text class="num" x="267" y="245">1</text>
  <circle cx="519" cy="240" r="16" fill="#fbbf24"/><text class="num" x="514" y="245">2</text>
  <circle cx="766" cy="240" r="16" fill="#fbbf24"/><text class="num" x="761" y="245">3</text>
  <circle cx="888" cy="350" r="16" fill="#fbbf24"/><text class="num" x="883" y="355">4</text>
  <circle cx="766" cy="460" r="16" fill="#fbbf24"/><text class="num" x="761" y="465">5</text>
  <circle cx="519" cy="460" r="16" fill="#86efac"/><text class="num" x="514" y="465">6</text>
  <circle cx="272" cy="460" r="16" fill="#86efac"/><text class="num" x="267" y="465">7</text>
  <text class="small" x="65" y="640">Architectural point: commands are durable before dispatch; charger replies become events, not hidden in transient gateway state.</text>
</svg>
