<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Straumvakt Event Flow</title>
  <desc id="desc">Inbound event flow from charger to UI through gateway, API, event log, and projections.</desc>
  <defs>
    <style>
      .bg{fill:#08111f}.box{fill:#0f1b2d;stroke:#3b526f;stroke-width:1.5;rx:8}.green{fill:#10251f;stroke:#3d8b68;stroke-width:1.5;rx:8}.purple{fill:#241a33;stroke:#7551a3;stroke-width:1.5;rx:8}.gold{fill:#2b2414;stroke:#c59b3d;stroke-width:1.5;rx:8}
      .title{fill:#fff;font:800 34px Inter,Segoe UI,Arial}.label{fill:#fff;font:700 19px Inter,Segoe UI,Arial}.small{fill:#aebbd0;font:13px Inter,Segoe UI,Arial}.num{fill:#08111f;font:800 15px Inter,Segoe UI,Arial}
      .a{stroke:#7dd3fc;stroke-width:2.4;fill:none;marker-end:url(#arr)}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7dd3fc"/></marker>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="48" y="58">Inbound Charger Event Flow</text>
  <text class="small" x="48" y="86">A charger message becomes a durable event, then a domain projection the UI can read.</text>

  <rect class="purple" x="70" y="190" width="185" height="100"/><text class="label" x="102" y="230">Charger</text><text class="small" x="102" y="258">OCPP frame</text>
  <rect class="purple" x="300" y="190" width="205" height="100"/><text class="label" x="332" y="230">Gateway DO</text><text class="small" x="332" y="258">parse and authenticate</text>
  <rect class="green" x="550" y="190" width="205" height="100"/><text class="label" x="582" y="230">Event Ingest</text><text class="small" x="582" y="258">validate envelope</text>
  <rect class="gold" x="800" y="190" width="205" height="100"/><text class="label" x="832" y="230">Event Log</text><text class="small" x="832" y="258">idempotent write</text>

  <rect class="green" x="800" y="410" width="205" height="100"/><text class="label" x="832" y="450">Projection</text><text class="small" x="832" y="478">session, status, meter</text>
  <rect class="gold" x="550" y="410" width="205" height="100"/><text class="label" x="582" y="450">Tables</text><text class="small" x="582" y="478">charging, ocpp, billing</text>
  <rect class="box" x="300" y="410" width="205" height="100"/><text class="label" x="332" y="450">API Read</text><text class="small" x="332" y="478">tenant-scoped query</text>
  <rect class="box" x="70" y="410" width="185" height="100"/><text class="label" x="102" y="450">UI</text><text class="small" x="102" y="478">dashboard and diagnostics</text>

  <path class="a" d="M255 240 L300 240"/><path class="a" d="M505 240 L550 240"/><path class="a" d="M755 240 L800 240"/>
  <path class="a" d="M902 290 L902 410"/><path class="a" d="M800 460 L755 460"/><path class="a" d="M550 460 L505 460"/><path class="a" d="M300 460 L255 460"/>
  <circle cx="285" cy="240" r="16" fill="#7dd3fc"/><text class="num" x="280" y="245">1</text>
  <circle cx="535" cy="240" r="16" fill="#7dd3fc"/><text class="num" x="530" y="245">2</text>
  <circle cx="785" cy="240" r="16" fill="#7dd3fc"/><text class="num" x="780" y="245">3</text>
  <circle cx="902" cy="350" r="16" fill="#7dd3fc"/><text class="num" x="897" y="355">4</text>
  <circle cx="780" cy="460" r="16" fill="#7dd3fc"/><text class="num" x="775" y="465">5</text>
  <circle cx="530" cy="460" r="16" fill="#7dd3fc"/><text class="num" x="525" y="465">6</text>
  <circle cx="280" cy="460" r="16" fill="#7dd3fc"/><text class="num" x="275" y="465">7</text>
  <text class="small" x="70" y="640">Architectural point: event log first, projections second. UI should read projected state, not raw protocol frames.</text>
</svg>
