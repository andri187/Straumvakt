<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1010" viewBox="0 0 1440 1010" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5C6B77"/>
    </marker>
    <marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#A5680C"/>
    </marker>
    <style>
      .t   { font-size:15px; font-weight:600; fill:#101820 }
      .s   { font-size:11.5px; fill:#5C6B77 }
      .lbl { font-size:10.5px; fill:#5C6B77; letter-spacing:.06em }
      .band{ font-size:12px; font-weight:600; letter-spacing:.14em; fill:#5C6B77 }
      .note{ font-size:12.5px; fill:#3D4A57 }
      .h1  { font-size:23px; font-weight:700; fill:#101820 }
      .h2  { font-size:12.5px; fill:#66757F }
      .fx  { font-size:12.5px; fill:#101820 }
      .fxs { font-size:11.5px; fill:#66757F }
    </style>
  </defs>

  <rect width="1440" height="1010" fill="#FBFCFD"/>

  <text x="40" y="42" class="h1">Straumvakt — the associations</text>
  <text x="40" y="64" class="h2">As settled 28 August 2026. Two axes that never touch, and a record that never carries money.</text>
  <line x1="40" y1="80" x2="1400" y2="80" stroke="#D3DBE3" stroke-width="1"/>

  <!-- ============ BAND A : ASSETS ============ -->
  <text x="40" y="112" class="band">ASSETS — THE PHYSICAL SPINE</text>

  <g>
    <rect x="40" y="126" width="200" height="70" rx="3" fill="#E4F0F7" stroke="#0B5D8A" stroke-width="1.5"/>
    <text x="56" y="152" class="t">Org · CPO</text>
    <text x="56" y="172" class="s">the e-meter's named owner</text>
    <text x="56" y="187" class="s">at the DSO</text>

    <line x1="240" y1="161" x2="284" y2="161" stroke="#5C6B77" stroke-width="1.4" marker-end="url(#ah)"/>

    <rect x="290" y="126" width="200" height="70" rx="3" fill="#E4F0F7" stroke="#0B5D8A" stroke-width="1.5"/>
    <text x="306" y="152" class="t">Installation</text>
    <text x="306" y="172" class="s">= one meter</text>
    <text x="306" y="187" class="s">= one utility bill</text>

    <line x1="490" y1="161" x2="534" y2="161" stroke="#5C6B77" stroke-width="1.4" marker-end="url(#ah)"/>

    <rect x="540" y="126" width="170" height="70" rx="3" fill="#E4F0F7" stroke="#0B5D8A" stroke-width="1.5"/>
    <text x="556" y="152" class="t">Circuit</text>
    <text x="556" y="172" class="s">electrical reality,</text>
    <text x="556" y="187" class="s">from the hardware</text>

    <line x1="710" y1="161" x2="754" y2="161" stroke="#5C6B77" stroke-width="1.4" marker-end="url(#ah)"/>

    <rect x="760" y="126" width="190" height="70" rx="3" fill="#E4F0F7" stroke="#0B5D8A" stroke-width="1.5"/>
    <text x="776" y="152" class="t">Placement</text>
    <text x="776" y="172" class="s">device × installation</text>
    <text x="776" y="187" class="s">× time — dated</text>

    <line x1="1000" y1="161" x2="956" y2="161" stroke="#5C6B77" stroke-width="1.4" marker-end="url(#ah)"/>

    <rect x="1000" y="126" width="170" height="70" rx="3" fill="#E4F0F7" stroke="#0B5D8A" stroke-width="1.5"/>
    <text x="1016" y="152" class="t">Device</text>
    <text x="1016" y="172" class="s">immortal · carries</text>
    <text x="1016" y="187" class="s">lifetime stats</text>

    <line x1="1220" y1="161" x2="1176" y2="161" stroke="#5C6B77" stroke-width="1.4" marker-end="url(#ah)"/>

    <rect x="1220" y="126" width="180" height="70" rx="3" fill="#E4F0F7" stroke="#0B5D8A" stroke-width="1.5"/>
    <text x="1236" y="152" class="t">OCPP identity</text>
    <text x="1236" y="172" class="s">a credential, dated —</text>
    <text x="1236" y="187" class="s">not a hardware fact</text>
  </g>

  <text x="40" y="222" class="note">A device is immortal; where it sits is dated. A charger that moves mid-month belongs to the old host for eleven days and the new one for the rest.</text>

  <line x1="40" y1="244" x2="1400" y2="244" stroke="#E4EAF0" stroke-width="1"/>

  <!-- ============ BAND B : ACCESS ============ -->
  <text x="40" y="278" class="band">ACCESS — MAY THIS DRIVER CHARGE HERE?</text>

  <g>
    <rect x="40" y="294" width="170" height="70" rx="3" fill="#DFEEE9" stroke="#2C7565" stroke-width="1.5"/>
    <text x="56" y="320" class="t">Driver</text>
    <text x="56" y="340" class="s">holds one or more</text>
    <text x="56" y="355" class="s">tokens</text>

    <line x1="210" y1="329" x2="254" y2="329" stroke="#5C6B77" stroke-width="1.4" marker-end="url(#ah)"/>
    <text x="212" y="318" class="lbl">dated</text>

    <rect x="260" y="294" width="200" height="70" rx="3" fill="#DFEEE9" stroke="#2C7565" stroke-width="1.5"/>
    <text x="276" y="320" class="t">Driver group</text>
    <text x="276" y="340" class="s">membership closed,</text>
    <text x="276" y="355" class="s">never deleted</text>

    <line x1="460" y1="329" x2="554" y2="329" stroke="#2C7565" stroke-width="1.6" marker-end="url(#ah)"/>

    <rect x="560" y="286" width="240" height="86" rx="3" fill="#2C7565" stroke="#2C7565" stroke-width="1.5"/>
    <text x="580" y="316" class="t" fill="#FFFFFF">GRANT</text>
    <text x="580" y="336" class="s" fill="#DFEEE9">dated · group-to-group only</text>
    <text x="580" y="353" class="s" fill="#DFEEE9">access resolves as a union,</text>
    <text x="580" y="368" class="s" fill="#DFEEE9">no precedence to get wrong</text>

    <line x1="800" y1="329" x2="894" y2="329" stroke="#2C7565" stroke-width="1.6" marker-end="url(#ah)"/>

    <rect x="900" y="294" width="220" height="70" rx="3" fill="#DFEEE9" stroke="#2C7565" stroke-width="1.5"/>
    <text x="916" y="320" class="t">Charger group</text>
    <text x="916" y="340" class="s">scoped to ONE installation</text>
    <text x="916" y="355" class="s">— the bill boundary</text>

    <line x1="1120" y1="329" x2="1164" y2="329" stroke="#5C6B77" stroke-width="1.4" marker-end="url(#ah)"/>
    <text x="1122" y="318" class="lbl">dated</text>

    <rect x="1170" y="294" width="230" height="70" rx="3" fill="#DFEEE9" stroke="#2C7565" stroke-width="1.5"/>
    <text x="1186" y="320" class="t">Chargers</text>
    <text x="1186" y="340" class="s">named as placements,</text>
    <text x="1186" y="355" class="s">never as hardware</text>

    <path d="M1285 294 L1285 262 L855 262 L855 200" fill="none" stroke="#0B5D8A" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  </g>

  <text x="40" y="392" class="note">A single driver is a group of one; a single charger is a group of one — the UI hides the singleton. One relationship type, one resolution path.</text>
  <text x="40" y="412" class="note">A charger group is <tspan font-weight="600">not</tspan> a circuit: the circuit is electrical reality, the group is a commercial construct. Never interchangeable on a screen.</text>

  <line x1="40" y1="434" x2="1400" y2="434" stroke="#E4EAF0" stroke-width="1"/>

  <!-- ============ BAND C : COST ============ -->
  <text x="40" y="468" class="band">COST OWNERSHIP — WHOSE MONEY IS THIS?</text>

  <g>
    <rect x="40" y="484" width="170" height="70" rx="3" fill="#F7EDDA" stroke="#A5680C" stroke-width="1.5"/>
    <text x="56" y="510" class="t">Driver</text>
    <text x="56" y="530" class="s">the same person as</text>
    <text x="56" y="545" class="s">in the band above</text>

    <line x1="210" y1="519" x2="254" y2="519" stroke="#5C6B77" stroke-width="1.4" marker-end="url(#ah)"/>

    <rect x="260" y="476" width="260" height="86" rx="3" fill="#F7EDDA" stroke="#A5680C" stroke-width="1.5"/>
    <text x="276" y="504" class="t">Cost assignment</text>
    <text x="276" y="524" class="s">default from the group,</text>
    <text x="276" y="540" class="s">overridable per driver, dated —</text>
    <text x="276" y="555" class="s">so A and B can differ in one group</text>

    <line x1="520" y1="519" x2="564" y2="519" stroke="#5C6B77" stroke-width="1.4" marker-end="url(#ah)"/>

    <rect x="570" y="484" width="220" height="70" rx="3" fill="#A5680C" stroke="#A5680C" stroke-width="1.5"/>
    <text x="586" y="510" class="t" fill="#FFFFFF">Factor owner</text>
    <text x="586" y="530" class="s" fill="#F7EDDA">the host · another company ·</text>
    <text x="586" y="545" class="s" fill="#F7EDDA">the driver themselves</text>

    <rect x="860" y="470" width="540" height="176" rx="3" fill="#FFFFFF" stroke="#D3DBE3" stroke-width="1.5"/>
    <text x="880" y="496" class="t">Cost factors — each has exactly one owner</text>
    <line x1="880" y1="508" x2="1380" y2="508" stroke="#E4EAF0"/>
    <text x="880" y="530" class="fx">Energy</text>
    <text x="1000" y="530" class="fxs">split three ways: DSO · retailer · CPO add-on</text>
    <text x="880" y="554" class="fx">Plug time</text>
    <text x="1000" y="554" class="fxs">occupancy, priced by duration</text>
    <text x="880" y="578" class="fx">Subscription</text>
    <text x="1000" y="578" class="fxs">per connector, and per active driver</text>
    <text x="880" y="602" class="fx">Cap relief</text>
    <text x="1000" y="602" class="fxs">where a ceiling applies</text>
    <text x="880" y="626" class="fx">Correction</text>
    <text x="1000" y="626" class="fxs">a new line, never a rewrite</text>
  </g>

  <text x="40" y="588" class="note">Access and cost are <tspan font-weight="600">separate axes</tspan>. A billing difference never forces a new access group — which is</text>
  <text x="40" y="608" class="note">how the old model exploded. An unresolvable owner is a refusal, never a default payer.</text>

  <line x1="40" y1="672" x2="1400" y2="672" stroke="#E4EAF0" stroke-width="1"/>

  <!-- ============ BAND D : RECORD vs DERIVATION ============ -->
  <text x="40" y="706" class="band">THE RECORD, AND THE DERIVATION</text>

  <g>
    <rect x="40" y="722" width="320" height="96" rx="3" fill="#EDF1F4" stroke="#4A5A66" stroke-width="1.5"/>
    <text x="58" y="750" class="t">Session · the CDR</text>
    <text x="58" y="772" class="s">sealed at start with the placement, the site</text>
    <text x="58" y="788" class="s">and the tariff <tspan font-weight="600">version</tspan> — never prices</text>
    <text x="58" y="806" class="s">carries no amount, no owner, no cost centre</text>

    <path d="M360 770 L516 770" fill="none" stroke="#A5680C" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ahd)"/>
    <text x="372" y="758" class="lbl" fill="#A5680C">DERIVES FROM — ONE WAY</text>

    <rect x="522" y="722" width="330" height="96" rx="3" fill="#F7EDDA" stroke="#A5680C" stroke-width="1.5"/>
    <text x="540" y="750" class="t">Billing lines</text>
    <text x="540" y="772" class="s">one per factor, each naming its owner</text>
    <text x="540" y="788" class="s">and the rate version it was priced at</text>
    <text x="540" y="806" class="s">stored beside the record, never inside it</text>

    <line x1="852" y1="770" x2="896" y2="770" stroke="#5C6B77" stroke-width="1.4" marker-end="url(#ah)"/>

    <rect x="902" y="722" width="280" height="96" rx="3" fill="#F7EDDA" stroke="#A5680C" stroke-width="1.5"/>
    <text x="920" y="750" class="t">Statement · invoice</text>
    <text x="920" y="772" class="s">per recipient: a driver, a company,</text>
    <text x="920" y="788" class="s">or the host — from the same lines</text>
    <text x="920" y="806" class="s">closed period is immutable</text>

    <rect x="1204" y="722" width="196" height="96" rx="3" fill="#FFFFFF" stroke="#D3DBE3" stroke-width="1.5"/>
    <text x="1220" y="748" class="t" font-size="13">Resolution state</text>
    <text x="1220" y="768" class="s">estimated · ocpp_derived</text>
    <text x="1220" y="784" class="s">cdr_confirmed · mismatch</text>
    <text x="1220" y="802" class="s">an <tspan font-weight="600">input</tspan> to a factor</text>
  </g>

  <path d="M1302 722 L1302 700 L687 700 L687 722" fill="none" stroke="#A5680C" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ahd)"/>

  <rect x="40" y="846" width="1360" height="76" rx="3" fill="#EDF1F4" stroke="#D3DBE3" stroke-width="1"/>
  <text x="60" y="874" class="t" font-size="14">The test</text>
  <text x="60" y="898" class="note">Delete every billing line and re-derive all money from the CDRs plus the agreements. If you cannot, money has leaked into the record.</text>

  <text x="40" y="958" class="s">A factor may read how well a CDR resolved; the CDR never knows a factor exists. A late or corrected CDR re-derives an open period and never rewrites a closed one.</text>
  <text x="40" y="978" class="s">Charger groups flatten at the boundary to OCPI's location_id + evse_uids · driver groups are OCPP's groupIdToken · neither concept is invented here.</text>
</svg>
