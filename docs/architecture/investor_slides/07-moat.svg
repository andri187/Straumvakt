    <text x="530" y="715" fill="#AFC5D2" font-size="25" text-anchor="middle">hard to sell into lock-in</text>
    <rect x="1040" y="390" width="700" height="390" rx="34" fill="#102B37" stroke="#6FDCEA" stroke-width="3"/>
    <text x="1390" y="470" fill="#F8FAFC" font-size="38" font-weight="790" text-anchor="middle">Straumvakt</text>
