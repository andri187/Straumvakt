  <rect x="300" y="850" width="1320" height="92" rx="24" fill="#102B37" stroke="#6FDCEA" stroke-width="2"/>
  <text x="960" y="908" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="730" text-anchor="middle">Moat: operational truth plus commercial truth across heterogeneous infrastructure.</text>
