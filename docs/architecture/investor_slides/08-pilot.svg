<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1920" height="1080" fill="#07111F"/>
  <image href="assets/straumvakt-logo.png" x="95" y="70" width="128" height="82" preserveAspectRatio="xMidYMid meet"/>
  <text x="245" y="120" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="780">Straumvakt</text>
  <text x="120" y="210" fill="#6FDCEA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" letter-spacing="4">PILOT</text>
  <text x="120" y="290" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="800">Prove operating value, not CPMS replacement</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="145" y="410" width="360" height="300" rx="28" fill="#0F2132" stroke="#29445A"/>
    <text x="325" y="480" fill="#F8FAFC" font-size="30" font-weight="760" text-anchor="middle">1. Onboard</text>
    <text x="325" y="550" fill="#AFC5D2" font-size="22" text-anchor="middle">sites, assets, drivers</text>
    <text x="325" y="590" fill="#AFC5D2" font-size="22" text-anchor="middle">and cost centers</text>
    <rect x="560" y="410" width="360" height="300" rx="28" fill="#0F2132" stroke="#29445A"/>
    <text x="740" y="480" fill="#F8FAFC" font-size="30" font-weight="760" text-anchor="middle">2. Connect</text>
    <text x="740" y="550" fill="#AFC5D2" font-size="22" text-anchor="middle">OCPP plus API</text>
    <text x="740" y="590" fill="#AFC5D2" font-size="22" text-anchor="middle">or import path</text>
    <rect x="975" y="410" width="360" height="300" rx="28" fill="#0F2132" stroke="#29445A"/>
    <text x="1155" y="480" fill="#F8FAFC" font-size="30" font-weight="760" text-anchor="middle">3. Operate</text>
    <text x="1155" y="550" fill="#AFC5D2" font-size="22" text-anchor="middle">sessions, faults,</text>
    <text x="1155" y="590" fill="#AFC5D2" font-size="22" text-anchor="middle">status and retention</text>
    <rect x="1390" y="410" width="360" height="300" rx="28" fill="#102B37" stroke="#6FDCEA" stroke-width="3"/>
    <text x="1570" y="480" fill="#F8FAFC" font-size="30" font-weight="760" text-anchor="middle">4. Prove</text>
    <text x="1570" y="550" fill="#AFC5D2" font-size="22" text-anchor="middle">billing dashboard,</text>
    <text x="1570" y="590" fill="#AFC5D2" font-size="22" text-anchor="middle">issue evidence, reports</text>
  </g>
  <rect x="270" y="815" width="1380" height="112" rx="28" fill="#0E1D2B" stroke="#29445A"/>
  <text x="960" y="858" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="730" text-anchor="middle">Success: real charging activity, clean allocation and operator trust.</text>
  <text x="960" y="895" fill="#6FDCEA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Control-plane lock-in is not a blocker.</text>
</svg>
