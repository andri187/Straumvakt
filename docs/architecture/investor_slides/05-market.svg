<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1920" height="1080" fill="#07111F"/>
  <image href="assets/straumvakt-logo.png" x="95" y="70" width="128" height="82" preserveAspectRatio="xMidYMid meet"/>
  <text x="245" y="120" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="780">Straumvakt</text>
  <text x="120" y="210" fill="#6FDCEA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" letter-spacing="4">MARKET ENTRY</text>
  <text x="120" y="290" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="800">Start in Iceland, expand through complexity</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="150" y="405" width="460" height="350" rx="30" fill="#0F2132" stroke="#29445A"/>
    <text x="380" y="475" fill="#F8FAFC" font-size="33" font-weight="780" text-anchor="middle">Workplaces</text>
    <text x="380" y="545" fill="#AFC5D2" font-size="22" text-anchor="middle">employee charging</text>
    <text x="380" y="585" fill="#AFC5D2" font-size="22" text-anchor="middle">employer reimbursement</text>
    <text x="380" y="625" fill="#AFC5D2" font-size="22" text-anchor="middle">cost-center rules</text>
    <rect x="730" y="405" width="460" height="350" rx="30" fill="#0F2132" stroke="#29445A"/>
    <text x="960" y="475" fill="#F8FAFC" font-size="33" font-weight="780" text-anchor="middle">Property fleets</text>
    <text x="960" y="545" fill="#AFC5D2" font-size="22" text-anchor="middle">MDU, hotels, retail</text>
    <text x="960" y="585" fill="#AFC5D2" font-size="22" text-anchor="middle">mixed ownership</text>
    <text x="960" y="625" fill="#AFC5D2" font-size="22" text-anchor="middle">service workflows</text>
    <rect x="1310" y="405" width="460" height="350" rx="30" fill="#0F2132" stroke="#29445A"/>
    <text x="1540" y="475" fill="#F8FAFC" font-size="33" font-weight="780" text-anchor="middle">Operators</text>
    <text x="1540" y="545" fill="#AFC5D2" font-size="22" text-anchor="middle">multiple vendors</text>
    <text x="1540" y="585" fill="#AFC5D2" font-size="22" text-anchor="middle">locked-in CPMS</text>
    <text x="1540" y="625" fill="#AFC5D2" font-size="22" text-anchor="middle">analytics and billing</text>
  </g>
  <rect x="330" y="835" width="1260" height="88" rx="24" fill="#102B37" stroke="#6FDCEA" stroke-width="2"/>
  <text x="960" y="891" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="730" text-anchor="middle">Iceland is the wedge: close customers, real tariffs, fast reference wins.</text>
