<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1920" y2="1080"><stop stop-color="#06111F"/><stop offset="1" stop-color="#071018"/></linearGradient></defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <image href="assets/straumvakt-logo.png" x="95" y="70" width="128" height="82" preserveAspectRatio="xMidYMid meet"/>
  <text x="245" y="120" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="780">Straumvakt</text>
  <text x="120" y="210" fill="#6FDCEA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" letter-spacing="4">THE PROBLEM</text>
  <text x="120" y="290" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="56" font-weight="800">Charging operations are fragmented</text>
  <text x="120" y="348" fill="#AFC5D2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25">Operators inherit portals, protocols, vendors, contracts and billing rules that do not agree.</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="130" y="455" width="380" height="255" rx="26" fill="#101E2D" stroke="#29445A"/>
    <text x="320" y="515" fill="#F8FAFC" font-size="29" font-weight="760" text-anchor="middle">Control lock-in</text>
    <text x="320" y="575" fill="#9FB3C8" font-size="21" text-anchor="middle">Existing CPMS or OEM</text>
    <text x="320" y="612" fill="#9FB3C8" font-size="21" text-anchor="middle">cannot be replaced quickly</text>
    <rect x="565" y="455" width="380" height="255" rx="26" fill="#101E2D" stroke="#29445A"/>
    <text x="755" y="515" fill="#F8FAFC" font-size="29" font-weight="760" text-anchor="middle">Billing splits</text>
    <text x="755" y="575" fill="#9FB3C8" font-size="21" text-anchor="middle">Driver, employer, site,</text>
    <text x="755" y="612" fill="#9FB3C8" font-size="21" text-anchor="middle">owner, retailer and DSO</text>
    <rect x="1000" y="455" width="380" height="255" rx="26" fill="#101E2D" stroke="#29445A"/>
    <text x="1190" y="515" fill="#F8FAFC" font-size="29" font-weight="760" text-anchor="middle">Service blind spots</text>
    <text x="1190" y="575" fill="#9FB3C8" font-size="21" text-anchor="middle">Faults and uptime sit</text>
    <text x="1190" y="612" fill="#9FB3C8" font-size="21" text-anchor="middle">across disconnected tools</text>
    <rect x="1435" y="455" width="360" height="255" rx="26" fill="#101E2D" stroke="#29445A"/>
    <text x="1615" y="515" fill="#F8FAFC" font-size="29" font-weight="760" text-anchor="middle">Weak insight</text>
    <text x="1615" y="575" fill="#9FB3C8" font-size="21" text-anchor="middle">Data exists, but decisions</text>
    <text x="1615" y="612" fill="#9FB3C8" font-size="21" text-anchor="middle">are still manual</text>
  </g>
  <rect x="300" y="815" width="1320" height="92" rx="26" fill="#102B37" stroke="#6FDCEA" stroke-width="2"/>
  <text x="960" y="873" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="730" text-anchor="middle">The missing layer is operational and commercial truth.</text>
</svg>
