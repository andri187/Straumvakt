<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1040" viewBox="0 0 940 520">
<rect width="940" height="520" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
<path d="M0,0 L9,4.5 L0,9 z" fill="#9aa5b1"/></marker></defs><text x="30" y="28" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Proposed protocol and responsibility architecture</text><text x="30" y="45" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">OpenADR 3.1.0 coordinates capacity above the boundary; protection and device control stay below it</text><rect x="290" y="66" width="360" height="56" rx="7" fill="#f4f7fa" stroke="#9aa5b1" stroke-width="1.6"/><text x="470" y="90" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="700">Landsnet / TSO</text><text x="470" y="108" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="11" fill="#4a4a4a" text-anchor="middle" font-weight="400">constraint, balancing and market signals</text><line x1="470" y1="122" x2="470" y2="168" stroke="#9aa5b1" stroke-width="1.8" marker-end="url(#ah)"/><text x="470" y="138" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">upstream operating condition</text><rect x="30" y="178" width="300" height="62" rx="7" fill="#eef4fb" stroke="#2E6FD4" stroke-width="1.6"/><text x="180" y="202" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="700">DSO VTN</text><text x="180" y="220" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="11" fill="#4a4a4a" text-anchor="middle" font-weight="400">RARIK · Veitur · HS Veitur · OV · Norðurorka</text><rect x="370" y="178" width="250" height="62" rx="7" fill="#eef4fb" stroke="#2E6FD4" stroke-width="1.6"/><text x="495" y="202" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="700">CPO / Aggregator VEN</text><text x="495" y="220" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="11" fill="#4a4a4a" text-anchor="middle" font-weight="400">site portfolio and optimiser</text><rect x="660" y="178" width="250" height="62" rx="7" fill="#f4f7fa" stroke="#9aa5b1" stroke-width="1.6"/><text x="785" y="202" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="700">Market / settlement</text><text x="785" y="220" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="11" fill="#4a4a4a" text-anchor="middle" font-weight="400">ELMA, contracts, metering</text><line x1="330" y1="200" x2="368" y2="200" stroke="#2E6FD4" stroke-width="1.8" marker-end="url(#ah)"/><text x="349" y="192" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10" fill="#2E6FD4" text-anchor="middle" font-weight="700">OpenADR 3.1.0</text><line x1="620" y1="209" x2="658" y2="209" stroke="#9aa5b1" stroke-width="1.8" marker-end="url(#ah)"/><text x="639" y="202" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">trade / settlement</text><line x1="180" y1="240" x2="180" y2="300" stroke="#9aa5b1" stroke-width="1.8" marker-end="url(#ah)"/><text x="180" y="263" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">operating envelope</text><line x1="495" y1="240" x2="495" y2="300" stroke="#9aa5b1" stroke-width="1.8" marker-end="url(#ah)"/><text x="495" y="263" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">availability / performance</text><rect x="30" y="310" width="300" height="62" rx="7" fill="#eef8f6" stroke="#0E9384" stroke-width="1.6"/><text x="180" y="334" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="700">Connection-point controller</text><text x="180" y="352" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="11" fill="#4a4a4a" text-anchor="middle" font-weight="400">revenue meter + hard limits</text><rect x="370" y="310" width="250" height="62" rx="7" fill="#eef8f6" stroke="#0E9384" stroke-width="1.6"/><text x="495" y="334" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="700">Site EMS / CSMS</text><text x="495" y="352" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="11" fill="#4a4a4a" text-anchor="middle" font-weight="400">OCPP, load allocation, BESS</text><rect x="660" y="310" width="250" height="62" rx="7" fill="#eef8f6" stroke="#0E9384" stroke-width="1.6"/><text x="785" y="334" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="700">Flexible resources</text><text x="785" y="352" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="11" fill="#4a4a4a" text-anchor="middle" font-weight="400">EVSE, BESS, V2G, HVAC, DER</text><line x1="330" y1="341" x2="368" y2="341" stroke="#9aa5b1" stroke-width="1.8" marker-end="url(#ah)"/><text x="349" y="334" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">boundary measurement</text><line x1="620" y1="341" x2="658" y2="341" stroke="#9aa5b1" stroke-width="1.8" marker-end="url(#ah)"/><text x="639" y="334" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">device control</text><rect x="30" y="402" width="880" height="42" rx="6" fill="#fdf5ea" stroke="#D97706" stroke-width="1.4"/><text x="470" y="421" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Safety and protection remain local and authoritative.</text><text x="470" y="437" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.5" fill="#4a4a4a" text-anchor="middle" font-weight="400">An OpenADR event may narrow an operating range. It may never defeat overcurrent, voltage, frequency, anti-islanding or emergency-stop functions.</text><text x="30" y="474" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" font-style="italic">North side principled, south side pragmatic: the DSO-facing leg is standard because it must be interoperable and long-lived;</text><text x="30" y="490" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" font-style="italic">the vendor-facing leg is whatever is fastest, because it is replaceable.</text>
</svg>