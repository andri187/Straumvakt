<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1120" viewBox="0 0 940 560">
<rect width="940" height="560" fill="#ffffff"/>
<text x="30" y="28" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Proposed 1 September closed-loop proof sequence</text><text x="30" y="45" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">The proof is boundary control with verified fallback — not a successful API call</text><rect x="38" y="60" width="164" height="26" rx="5" fill="#eef4fb" stroke="#2E6FD4" stroke-width="1.4"/><text x="120" y="78" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="700">DSO VTN</text><line x1="120" y1="88" x2="120" y2="546" stroke="#dde3e9" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="273" y="60" width="164" height="26" rx="5" fill="#eef4fb" stroke="#2E6FD4" stroke-width="1.4"/><text x="355" y="78" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="700">CPO VEN</text><line x1="355" y1="88" x2="355" y2="546" stroke="#dde3e9" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="518" y="60" width="164" height="26" rx="5" fill="#eef4fb" stroke="#2E6FD4" stroke-width="1.4"/><text x="600" y="78" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="700">Site EMS / OCPP</text><line x1="600" y1="88" x2="600" y2="546" stroke="#dde3e9" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="758" y="60" width="164" height="26" rx="5" fill="#eef4fb" stroke="#2E6FD4" stroke-width="1.4"/><text x="840" y="78" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="700">Boundary meter</text><line x1="840" y1="88" x2="840" y2="546" stroke="#dde3e9" stroke-width="1.5" stroke-dasharray="4 4"/><defs><marker id="sa" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2E6FD4"/></marker>
<marker id="sb" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#D97706"/></marker></defs><line x1="124" y1="122" x2="349" y2="122" stroke="#2E6FD4" stroke-width="2" marker-end="url(#sa)"/><text x="237.5" y="114" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.8" fill="#4a4a4a" text-anchor="middle" font-weight="400">1. Register / authenticate resource</text><line x1="351" y1="160" x2="126" y2="160" stroke="#2E6FD4" stroke-width="2" marker-end="url(#sa)"/><text x="237.5" y="152" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.8" fill="#4a4a4a" text-anchor="middle" font-weight="400">2. Report current power + capacity request</text><line x1="124" y1="198" x2="349" y2="198" stroke="#D97706" stroke-width="2" marker-end="url(#sb)"/><text x="237.5" y="190" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.8" fill="#D97706" text-anchor="middle" font-weight="600">3. Event: IMPORT_CAPACITY_LIMIT = 175 kW, 10 min</text><line x1="359" y1="236" x2="594" y2="236" stroke="#2E6FD4" stroke-width="2" marker-end="url(#sa)"/><text x="477.5" y="228" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.8" fill="#4a4a4a" text-anchor="middle" font-weight="400">4. Translate envelope to site power cap</text><line x1="836" y1="274" x2="606" y2="274" stroke="#2E6FD4" stroke-width="2" marker-end="url(#sa)"/><text x="720" y="266" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.8" fill="#4a4a4a" text-anchor="middle" font-weight="400">5. Read authoritative net power</text><line x1="596" y1="312" x2="361" y2="312" stroke="#2E6FD4" stroke-width="2" marker-end="url(#sa)"/><text x="477.5" y="304" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.8" fill="#4a4a4a" text-anchor="middle" font-weight="400">6. Telemetry: actual import</text><line x1="351" y1="350" x2="126" y2="350" stroke="#D97706" stroke-width="2" marker-end="url(#sb)"/><text x="237.5" y="342" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.8" fill="#D97706" text-anchor="middle" font-weight="600">7. Report referencing event ID</text><line x1="124" y1="388" x2="349" y2="388" stroke="#2E6FD4" stroke-width="2" marker-end="url(#sa)"/><text x="237.5" y="380" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.8" fill="#4a4a4a" text-anchor="middle" font-weight="400">8. Revise envelope to 300 kW</text><line x1="359" y1="426" x2="594" y2="426" stroke="#2E6FD4" stroke-width="2" marker-end="url(#sa)"/><text x="477.5" y="418" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.8" fill="#4a4a4a" text-anchor="middle" font-weight="400">9. Apply revised cap within SLA</text><line x1="124" y1="464" x2="349" y2="464" stroke="#D97706" stroke-width="2" marker-end="url(#sb)"/><text x="237.5" y="456" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.8" fill="#D97706" text-anchor="middle" font-weight="600">10. Deliberate comms loss</text><line x1="359" y1="502" x2="594" y2="502" stroke="#D97706" stroke-width="2" marker-end="url(#sb)"/><text x="477.5" y="494" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.8" fill="#D97706" text-anchor="middle" font-weight="600">11. Local timeout → IMPORT_CAPACITY_SUBSCRIPTION</text><text x="30" y="520" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" font-style="italic">Amber steps are the ones most often omitted from a demonstration and most likely to fail in production: the envelope event itself,</text><text x="30" y="536" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" font-style="italic">the report that references its event ID (there is no application-level ACK in OpenADR 3), and the locally enforced comms-loss fallback.</text>
</svg>