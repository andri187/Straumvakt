amily='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">2019</text><rect x="553.2" y="314.987" width="39.6" height="59.01299999999998" rx="4" fill="#2E6FD4"/><text x="573" y="394" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">2020</text><rect x="619.2" y="277.2814285714286" width="39.6" height="96.71857142857141" rx="4" fill="#2E6FD4"/><text x="639" y="394" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">2021</text><rect x="685.2" y="210.42485714285712" width="39.6" height="163.57514285714288" rx="4" fill="#2E6FD4"/><text x="705" y="394" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">2022</text><rect x="751.2" y="165.07885714285715" width="39.6" height="208.92114285714285" rx="4" fill="#2E6FD4"/><text x="771" y="394" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">2023</text><rect x="817.2" y="89.17114285714285" width="39.6" height="284.82885714285715" rx="4" fill="#2E6FD4"/><text x="837" y="394" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">2024</text><text x="837" y="81.17114285714285" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="11.5" fill="#2E6FD4" text-anchor="middle" font-weight="700">25,238</text><rect x="550" y="64" width="320" height="62" rx="6" fill="#eef8f6" stroke="#0E9384" stroke-width="1.4"/><text x="564" y="85" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="700">48× growth 2015→2024 — ≈53% per year</text><text x="564" y="102" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.8" fill="#4a4a4a" text-anchor="start" font-weight="400">By start-2026: 36,657 pure-electric passenger cars,</text><text x="564" y="117" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10.8" fill="#4a4a4a" text-anchor="start" font-weight="400">14.4% of the fleet; 41% of 2025 new registrations.</text><line x1="78" y1="374" x2="870" y2="374" stroke="#9aa5b1" stroke-width="1"/><text x="78" y="428" font-family='Segoe UI, Calibri, Helvetica, Arial, sans-serif' font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" font-style="italic">Single series — no legend required. Fleet count understates charging-peak growth: battery size and session power both rose over the period.</text>
